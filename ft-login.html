<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Cryptomice Free Tasks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:#facc15;
margin-bottom:10px;
}

p{
text-align:center;
color:#d1d5db;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:6px;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
margin-bottom:10px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:8px;
background:#facc15;
color:#111827;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#eab308;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#facc15;
text-decoration:none;
}

.notice{
margin-top:20px;
background:#1f2937;
padding:15px;
border-radius:8px;
font-size:14px;
line-height:1.6;
}

</style>

</head>


<body>


<div class="container">


<h1>
Welcome Back
</h1>


<p>
Login to your Free Tasks account.
</p>



<form id="loginForm">


<label>
Email Address
</label>

<input 
type="email" 
id="email" 
placeholder="Enter your email" 
required>



<label>
Password
</label>

<input 
type="password" 
id="password" 
placeholder="Enter your password" 
required>



<button type="submit">
Login
</button>


</form>



<div id="msg" style="text-align:center;margin-top:15px;"></div>



<div class="notice">

<b>Reminder</b>

<br><br>

Access to Free Tasks is restricted to eligible users.

<br>

VPNs and proxy connections are not allowed.

</div>



<div class="signup">

Don't have an account?

<a href="ft-signup.html">
Create one
</a>

</div>


</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";


import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";



const firebaseConfig={


apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"


};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);



document.getElementById("loginForm").addEventListener("submit",async(e)=>{


e.preventDefault();



const email=document.getElementById("email").value.trim().toLowerCase();

const password=document.getElementById("password").value;


const msg=document.getElementById("msg");



try{


await signInWithEmailAndPassword(auth,email,password);



msg.style.color="#22c55e";

msg.innerText="Login successful...";



setTimeout(()=>{

window.location.href="ft-dashboard.html";

},800);



}catch(error){


msg.style.color="#ef4444";


if(error.code==="auth/invalid-credential"){

msg.innerText="Incorrect email or password.";

}

else if(error.code==="auth/too-many-requests"){

msg.innerText="Too many attempts. Try again later.";

}

else{

msg.innerText=error.message;

}


}



});


</script>


</body>

  </html>
