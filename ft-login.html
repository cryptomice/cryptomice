<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Login | Cryptomice Free Tasks</title>  <style>

h1{

margin-bottom:10px;  
}  
  
p{  
text-align:center;  
color:#d1d5db;  
margin-bottom:25px;  
}  
  
label{  
display:block;  
margin-bottom:6px;  
margin-top:15px;

}  
  
input{

button{

button:hover{

.signup{

.signup a{

}  
  
.notice{

background:#1f2937;  
padding:15px;

</style>  </head>  <body>  <div class="container">  <h1>Welcome Back</h1>  <p>Login to your Free Tasks account.</p>  <form id="loginForm">  <label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit">  
Login  
</button>  </form>  <div class="notice">  
<b>Reminder</b><br><br>  
Access to Free Tasks is restricted to eligible users. VPNs and proxy connections are not allowed.  
</div>  <div class="signup">  
Don't have an account?  
<a href="ft-signup.html">Create one</a>  
</div>  </div>  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");

const message = document.createElement("p");
message.style.marginTop = "15px";
message.style.textAlign = "center";
form.appendChild(message);

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const email = document.getElementById("email").value.trim().toLowerCase();

const password = document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

message.style.color="#22c55e";

message.innerText="Login successful...";

setTimeout(()=>{

window.location.href="ft-dashboard.html";

},800);

}catch(error){

message.style.color="#ef4444";

switch(error.code){

case "auth/invalid-credential":
message.innerText="Incorrect email or password.";
break;

case "auth/user-not-found":
message.innerText="Account not found.";
break;

case "auth/wrong-password":
message.innerText="Incorrect password.";
break;

case "auth/too-many-requests":
message.innerText="Too many attempts. Try again later.";
break;

default:
message.innerText=error.message;

}

}

});

  </script>  </body>  
</html>
