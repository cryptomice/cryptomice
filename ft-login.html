<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Cryptomice Free Tasks</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:#facc15;
margin-bottom:10px;
}

p{
text-align:center;
color:#d1d5db;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:6px;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:8px;
background:#facc15;
color:#111827;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#eab308;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#facc15;
text-decoration:none;
}

#msg{
margin-top:15px;
text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h1>Welcome Back</h1>

<p>Login to your Free Tasks account.</p>

<form id="loginForm">

<label>Email Address</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">
Login
</button>

<p id="msg"></p>

</form>


<div class="signup">
Don't have an account?
<a href="ft-signup.html">Create one</a>
</div>


</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";


import { 
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";


const firebaseConfig = {

apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const form=document.getElementById("loginForm");

const msg=document.getElementById("msg");



form.addEventListener("submit", async(e)=>{

e.preventDefault();


const email=document
.getElementById("email")
.value
.trim()
.toLowerCase();


const password=document
.getElementById("password")
.value;


msg.style.color="white";
msg.innerText="Checking account...";


try{


const result = await signInWithEmailAndPassword(
auth,
email,
password
);


console.log("Logged in:", result.user.uid);


msg.style.color="#22c55e";
msg.innerText="Login successful...";


setTimeout(()=>{

window.location.href="ft-dashboard.html";

},800);



}catch(error){


console.log(error.code);


msg.style.color="#ef4444";


if(error.code==="auth/user-not-found"){

msg.innerText="Account not found.";

}

else if(error.code==="auth/wrong-password"){

msg.innerText="Incorrect password.";

}

else if(error.code==="auth/invalid-credential"){

msg.innerText="Incorrect email or password.";

}

else{

msg.innerText=error.message;

}


}


});



</script>


</body>
</html>
