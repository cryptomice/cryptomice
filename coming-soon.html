<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice - Coming Soon</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#03060c;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
}

/* GOLD GLOW BACKGROUND */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,215,0,0.18), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,215,0,0.10), transparent 45%),
radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 60%);
animation:glow 6s infinite alternate ease-in-out;
z-index:0;
}

@keyframes glow{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

.container{
position:relative;
z-index:1;
text-align:center;
padding:30px;
border-radius:16px;
background:rgba(11,18,32,0.7);
border:1px solid rgba(255,215,0,0.2);
box-shadow:0 0 25px rgba(255,215,0,0.1);
}

h1{
font-size:42px;
color:#ffd84d;
text-shadow:0 0 12px rgba(255,216,77,0.6);
letter-spacing:2px;
}
</style>
</head>

<body>

<div class="container">
<h1>Coming Soon</h1>
</div>

</body>
</html>
