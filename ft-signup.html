<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Cryptomice</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:#111827;
padding:30px;
border-radius:12px;
}

h1{
text-align:center;
color:#facc15;
margin-bottom:10px;
}

p{
text-align:center;
color:#d1d5db;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border-radius:8px;
border:none;
background:#1f2937;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:8px;
background:#facc15;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#eab308;
}

#msg{
margin-top:15px;
text-align:center;
}

.login{
text-align:center;
margin-top:20px;
}

.login a{
color:#facc15;
text-decoration:none;
}

</style>

</head>

<body>


<div class="container">

<h1>Create Free Account</h1>

<p>Join Cryptomice Free Tasks.</p>


<form id="signupForm">


<label>Full Name</label>

<input id="fullname" type="text" required>



<label>Email Address</label>

<input id="email" type="email" required>



<label>Password</label>

<input id="password" type="password" required>



<label>Confirm Password</label>

<input id="confirmPassword" type="password" required>



<button>
Create Account
</button>


<p id="msg"></p>


</form>


<div class="login">

Already have an account?

<a href="ft-login.html">
Login
</a>

</div>


</div>



<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";



const firebaseConfig={


apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"


};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);



const form=document.getElementById("signupForm");

const msg=document.getElementById("msg");



form.addEventListener("submit",async(e)=>{


e.preventDefault();



const fullname=document
.getElementById("fullname")
.value
.trim();



const email=document
.getElementById("email")
.value
.trim()
.toLowerCase();



const password=document
.getElementById("password")
.value;



const confirm=document
.getElementById("confirmPassword")
.value;



if(password!==confirm){


msg.style.color="red";

msg.innerText="Passwords do not match.";

return;


}



try{


msg.style.color="white";

msg.innerText="Creating account...";



const userCredential=
await createUserWithEmailAndPassword(
auth,
email,
password
);



const uid=userCredential.user.uid;



await setDoc(
doc(db,"ft_users",uid),
{


uid:uid,

fullname: fullname,

email: email,

balance: 100,

referrals: 0,

approvedTasks: 0,

pendingTasks: 0,

completedTasks: 0,

totalEarned: 0,

accountStatus: "active",

createdAt: serverTimestamp()


});



msg.style.color="#22c55e";

msg.innerText="Account created successfully.";



setTimeout(()=>{


window.location.href="ft-dashboard.html";


},1000);



}catch(error){


msg.style.color="red";



if(error.code==="auth/email-already-in-use"){

msg.innerText="Email already registered.";

}

else{

msg.innerText=error.message;

}



}



});


</script>


</body>
</html>
