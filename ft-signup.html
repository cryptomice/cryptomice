<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Free Account | Cryptomice</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:420px;
background:#111827;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:#facc15;
margin-bottom:10px;
}

p{
text-align:center;
color:#d1d5db;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:6px;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
margin-bottom:10px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:8px;
background:#facc15;
color:#111827;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#eab308;
}

.notice{
margin-top:20px;
background:#1f2937;
padding:15px;
border-radius:8px;
font-size:14px;
line-height:1.6;
}

.login{
text-align:center;
margin-top:20px;
}

.login a{
color:#facc15;
text-decoration:none;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Free Account</h1>

<p>Join Cryptomice Free Tasks and start earning.</p>

<form id="signupForm">

<label>Full Name</label>
<input type="text" id="fullname" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create a password" required>

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm your password" required>

<button type="submit">
Create Account
</button>

<p id="msg"></p>

</form>

<div class="notice">

<b>Before creating your account:</b>

<br><br>

• Free to join.

<br>

• Only US residents are allowed.

<br>

• VPNs and proxies are not permitted.

<br>

• Each approved task pays <b>$0.25</b>.

<br>

• Minimum withdrawal is <b>$5.00</b>.

</div>

<div class="login">

Already have an account?

<a href="ft-login.html">Login</a>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("signupForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const fullname=document.getElementById("fullname").value.trim();

const email=document.getElementById("email").value.trim().toLowerCase();

const password=document.getElementById("password").value;

const confirmPassword=document.getElementById("confirmPassword").value;

const msg=document.getElementById("msg");

if(password!==confirmPassword){

msg.style.color="red";
msg.innerText="Passwords do not match.";

return;

}

try{

const userCredential=await createUserWithEmailAndPassword(auth,email,password);

const uid=userCredential.user.uid;

await setDoc(doc(db,"ft_users",uid),{

uid:uid,

fullname:fullname,

email:email,

balance:0,

completedTasks:0,

approvedTasks:0,

pendingTasks:0,

totalEarned:0,

minimumWithdrawal:5,

withdrawMethod:null,

paypalEmail:null,

litecoinAddress:null,

accountStatus:"active",

country:null,

vpnChecked:false,

createdAt:Date.now()

});

msg.style.color="#22c55e";
msg.innerText="Account created successfully.";

setTimeout(()=>{

window.location.href="ft-dashboard.html";

},1000);

}catch(error){

msg.style.color="red";
msg.innerText=error.message;

}

});

</script>

</body>
  </html>
