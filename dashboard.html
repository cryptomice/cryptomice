<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const BASE = "https://cryptomice.github.io/cryptomice/";

const getRefLink = (uid) => `${BASE}payment.html?ref=${uid}`;

function go(page){
window.location.href = BASE + page;
}

/* ================= FIXED AUTH FLOW ================= */
onAuthStateChanged(auth, async (user) => {

if (!user) {
go("payment.html");
return;
}

document.getElementById("userEmail").innerText =
"Logged in as: " + user.email;

/* ALWAYS SHOW DASHBOARD EVEN IF DB IS MISSING */
const userRef = doc(db, "users", user.uid);
let snap = await getDoc(userRef);

/* AUTO-REPAIR OLD USERS */
if (!snap.exists()) {
await setDoc(userRef, {
email: user.email,
earnings: 0,
referrals: 0,
createdAt: serverTimestamp(),
accountType: "user",
fixedAt: serverTimestamp()
});
snap = await getDoc(userRef);
}

const data = snap.data() || {};

/* UI */
document.getElementById("refLink").innerText = getRefLink(user.uid);
document.getElementById("refCount").innerText = data.referrals || 0;
document.getElementById("earnings").innerText = data.earnings || 0;

/* IMPORTANT: keep BOTH keys for compatibility */
localStorage.setItem("cryptomice_referrer", user.uid);
localStorage.setItem("referrer", user.uid);

});

/* COPY */
window.copyLink = function(){
navigator.clipboard.writeText(
document.getElementById("refLink").innerText
);
alert("Copied!");
};

/* WITHDRAW FIXED */
document.getElementById("withdrawBtn").addEventListener("click", async () => {

const amount = parseFloat(document.getElementById("withdrawAmount").value);
const wallet = document.getElementById("withdrawWallet").value.trim();
const msg = document.getElementById("withdrawMsg");

if(!auth.currentUser){
msg.innerText = "Not logged in";
return;
}

try {

msg.innerText = "Processing...";
msg.style.color = "white";

if (!amount || amount < 0.01) {
msg.innerText = "Minimum 0.01 LTC";
return;
}

if (!wallet) {
msg.innerText = "Enter wallet";
return;
}

const userRef = doc(db, "users", auth.currentUser.uid);
const snap = await getDoc(userRef);

if (!snap.exists()) {
msg.innerText = "Account repairing... reload page";
return;
}

const data = snap.data();
const earnings = data.earnings || 0;

if (amount > earnings) {
msg.innerText = "Insufficient balance";
return;
}

await addDoc(collection(db, "withdrawals"), {
userId: auth.currentUser.uid,
email: auth.currentUser.email,
amount,
wallet,
coin: "LTC",
status: "pending",
createdAt: serverTimestamp()
});

await updateDoc(userRef, {
earnings: earnings - amount
});

document.getElementById("earnings").innerText = earnings - amount;

msg.style.color = "lime";
msg.innerText = "Withdrawal sent";

} catch (e) {
msg.style.color = "red";
msg.innerText = e.message;
}

});
  </script>
