<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptomice Rewards Hub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#050812;
color:white;
}

.header{
padding:20px;
text-align:center;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:26px;
font-weight:bold;
color:#facc15;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.card{
background:#111827;
padding:18px;
border-radius:18px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.05);
}

.balance{
font-size:32px;
color:#facc15;
font-weight:bold;
}

.title{
font-size:18px;
margin-bottom:10px;
font-weight:bold;
}

.small{
font-size:13px;
color:#9ca3af;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.section{
margin-top:20px;
}

.badge{
display:inline-block;
padding:5px 10px;
background:#0b1220;
border-radius:50px;
font-size:12px;
margin-right:5px;
color:#d1d5db;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🐭 Cryptomice Rewards Hub</div>
</div>

<div class="container">

<div class="card">
<div class="small">Your Balance</div>
<div class="balance" id="balance">Loading...</div>
</div>

<!-- BITLABS MAIN SECTION -->
<div class="card">

<div class="title">🔥 Earn with Bitlabs Offer Wall</div>

<div class="small">
Complete real offers and earn Mice Coins instantly.
</div>

<button onclick="openBitlabs()">
Open Offer Wall
</button>

<div class="section">

<span class="badge">📊 Surveys</span>
<span class="badge">🎮 Gaming Offers</span>
<span class="badge">📱 App Installs</span>

</div>

</div>

<!-- OPTIONAL INTERNAL TASK -->
<div class="card">

<div class="title">🎁 Bonus Tasks (Optional)</div>

<div class="small">
Extra rewards while waiting for offers.
</div>

<button onclick="bonusTask()">
Complete Bonus Task (+10 Coins)
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore, doc, getDoc, setDoc, updateDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

/* AUTH */
onAuthStateChanged(auth, async (u)=>{
if(!u){
window.location.href="auth.html";
return;
}
user = u;
await ensureUser();
loadBalance();
});

/* USER CREATE */
async function ensureUser(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
email:user.email,
coins:0
});
}
}

/* BALANCE */
async function loadBalance(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

document.getElementById("balance").innerText =
(snap.data()?.coins || 0) + " Mice Coins";
}

/* BITLABS */
window.openBitlabs = function(){

let bitlabsOfferwallURL = "YOUR_BITLABS_OFFERWALL_LINK";

window.open(bitlabsOfferwallURL,"_blank");

};

/* BONUS TASK */
window.bonusTask = async function(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

let coins = snap.data()?.coins || 0;
coins += 10;

await updateDoc(ref,{coins});

loadBalance();

alert("+10 Coins Added");
};

</script>

</body>
</html>
