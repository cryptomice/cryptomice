<!DOCTYPE html>
<html>
<head>
<title>Cryptomice Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#050812;
color:white;
overflow-x:hidden;
}

/* BACKGROUND EFFECT */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(255,215,0,0.18), transparent 40%),
radial-gradient(circle at 80% 40%, rgba(255,215,0,0.10), transparent 45%),
radial-gradient(circle at 50% 80%, rgba(255,255,255,0.06), transparent 50%);
animation:floatGlow 8s infinite alternate ease-in-out;
pointer-events:none;
z-index:0;
}

@keyframes floatGlow{
0%{transform:scale(1);}
100%{transform:scale(1.15);}
}

body > *{position:relative;z-index:1;}

.header{
padding:15px;
text-align:center;
background:rgba(17,24,39,0.8);
border-bottom:1px solid rgba(255,215,0,0.15);
}

.header h2{
color:#ffd84d;
text-shadow:0 0 15px #ffd84d;
}

.container{
max-width:500px;
margin:20px auto;
padding:15px;
}

.card{
background:rgba(11,18,32,0.90);
border:1px solid rgba(255,215,0,0.15);
border-radius:14px;
padding:15px;
margin-bottom:20px;
}

input{
width:100%;
padding:13px;
margin:8px 0;
border-radius:10px;
border:1px solid rgba(255,215,0,0.18);
background:rgba(15,23,42,0.9);
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

.primary{
background:linear-gradient(90deg,#ffd84d,#ffcc00);
color:black;
}

.secondary{
background:#1f2937;
color:white;
}

.address{
background:#0f172a;
padding:10px;
border-radius:8px;
border:1px solid rgba(255,215,0,0.15);
word-break:break-all;
}

.social{
text-align:center;
margin:25px 0;
}

.social-text{
font-size:13px;
opacity:0.8;
margin-bottom:10px;
}

.social a{
display:inline-block;
padding:12px 20px;
border-radius:12px;
background:linear-gradient(90deg,#1877f2,#0d5ddb);
color:white;
font-weight:bold;
text-decoration:none;
}

.footer{
text-align:center;
padding:15px;
margin-top:30px;
border-top:1px solid rgba(255,215,0,0.15);
font-size:13px;
}

.footer a{
color:#ffd84d;
text-decoration:none;
margin:0 5px;
}

.txid-link{
display:block;
margin-top:10px;
color:#ffd84d;
text-decoration:underline;
font-size:13px;
}
</style>
</head>

<body>

<div class="header">
<h2>🐭 CRYPTOMICE</h2>
</div>

<div class="container">

<!-- PAYMENT -->
<div class="card">
<h3>1. Activate Access</h3>

<p>Send <b>0.0364 Litecoin (LTC)</b>:</p>

<div class="address">
ltc1q6e2ad703p0sx5pe2hz8qrqylnp05vy5wkxc4u5
</div>

<input id="email" placeholder="Enter email">
<input id="txid" placeholder="Enter TXID">

<button class="primary" onclick="smartGo('payment.html')">
Submit Payment
</button>

<button class="secondary" onclick="window.location.href='https://cryptomice.github.io/cryptomice/paymentmomo'">
Pay with MoMo Zambia
</button>

</div>

<!-- LOGIN -->
<div class="card">
<h3>2. Member Login</h3>

<input placeholder="Email">
<input type="password" placeholder="Password">

<button class="secondary" onclick="smartGo('dashboard.html')">
Login
</button>

</div>

<!-- SIGNUP -->
<div class="card">
<h3>3. Create Account</h3>

<button class="primary" onclick="smartGo('signup.html')">
GO TO SIGN UP
</button>

</div>

<!-- SOCIAL -->
<div class="social">

<div class="social-text">Join thousands talking about us</div>

<a href="https://www.facebook.com/profile.php?id=61551847504420" target="_blank">
Follow us on Facebook
</a>

</div>

</div>

<!-- FOOTER -->
<div class="footer">

<a href="about.html">About</a> |
<a href="terms.html">Terms</a> |
<a href="privacy.html">Privacy</a> |
<a href="disclaimer.html">Disclaimer</a> |
<a href="contact.html">Contact</a>

<a href="txid-guide.html" class="txid-link">
📘 How to find your TXID
</a>

</div>

<!-- SMARTLINK ENGINE -->
<script src="smartlink.js"></script>

<script>
/* UNIVERSAL SMART NAVIGATION */
function smartGo(page){
  if(window.smartNavigate){
    window.smartNavigate(page);
  } else {
    window.location.href = page;
  }
}
</script>

</body>
</html>
