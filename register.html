<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - Cryptomice</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050812;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
background:linear-gradient(145deg,#111827,#0f172a);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.05);
box-shadow:0 0 25px rgba(255,215,0,0.08);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#facc15;
margin-bottom:10px;
}

.subtitle{
text-align:center;
font-size:14px;
color:#9ca3af;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:12px;
border:none;
outline:none;
background:#0b1220;
color:white;
font-size:14px;
border:1px solid rgba(255,255,255,0.05);
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
color:#050812;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
opacity:0.9;
transform:scale(1.02);
}

.footer{
text-align:center;
margin-top:15px;
font-size:13px;
color:#9ca3af;
}

.footer a{
color:#facc15;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🐭 Cryptomice</div>

<div class="subtitle">
Create your free account
</div>

<input type="email" id="email" placeholder="Email Address">
<input type="password" id="password" placeholder="Password">

<button onclick="signUp()">
Create Account
</button>

<div class="footer">
Already have an account?
<a href="auth.html">Login</a>
</div>

</div>

<!-- SMART LINK ENGINE -->
<script src="smartlink.js"></script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

// SIGNUP
window.signUp = async function(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){
alert("Please fill all fields");
return;
}

if(password.length < 6){
alert("Password must be at least 6 characters");
return;
}

try{

const userCredential =
await createUserWithEmailAndPassword(auth,email,password);

const user = userCredential.user;

await setDoc(doc(db, "users", user.uid), {
email: user.email,
coins: 0,
tasksCompleted: 0,
referrals: 0,
createdAt: Date.now()
});

alert("Account created successfully!");

// SMART NAVIGATION (NOW CONSISTENT SYSTEM)
if(window.smartNavigate){
smartNavigate("earn.html");
} else {
window.location.href = "earn.html";
}

}catch(error){
alert(error.message);
}

};

</script>

</body>
</html>
