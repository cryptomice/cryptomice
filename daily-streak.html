];

let lastIndex = -1;

/* NON-REPEATING LINK */
function getRandomSmartLink(){
if(SMART_LINKS.length === 1) return SMART_LINKS[0];

let index;
do {
index = Math.floor(Math.random() * SMART_LINKS.length);
} while(index === lastIndex);

lastIndex = index;
return SMART_LINKS[index];
}

const ACCESS_TIME = 10 * 60 * 1000;

/* ANTI-REPLAY SESSION */
function newSessionToken(){
return Math.random().toString(36).substring(2) + Date.now();
}

/* SMART LINK GATE */
window.openLockedPage = function(page){

const unlock = localStorage.getItem("smartlink_unlock");
const now = Date.now();

/* already unlocked */
if(unlock && now < parseInt(unlock)){
window.location.href = page;
return;
}

/* prevent spam trigger */
if(sessionStorage.getItem("active_session")){
return;
}

sessionStorage.setItem("active_session", newSessionToken());

localStorage.setItem("target_page", page);
localStorage.setItem("awaiting_return", "yes");

window.open(getRandomSmartLink(), "_blank");

alert("Return back to continue access.");

};

/* RETURN DETECTION */
window.addEventListener("focus", ()=>{

if(localStorage.getItem("awaiting_return") === "yes"){

localStorage.removeItem("awaiting_return");
sessionStorage.removeItem("active_session");

const expires = Date.now() + ACCESS_TIME;
localStorage.setItem("smartlink_unlock", expires);

const target = localStorage.getItem("target_page") || "earn.html";

window.location.href = target;

}

});

</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

let user = null;

const DAILY_REWARD = 8;
const DAILY_COOLDOWN = 86400000;

/* AUTH */
onAuthStateChanged(auth, async (u)=>{

if(!u){
location.replace("auth.html");
return;
}

user = u;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
email:user.email,
coins:0,
lastClaim:0,
lastFaucet:0
});
}

document.getElementById("loading").style.display = "none";
document.getElementById("app").style.display = "block";

loadBalance();
checkCooldown();

});

async function loadBalance(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

document.getElementById("balance").innerText =
(snap.data().coins || 0) + " Mice Coins";

}

window.claimDaily = async function(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

const data = snap.data();

const now = Date.now();

if(now - (data.lastClaim || 0) < DAILY_COOLDOWN){
alert("Already claimed");
checkCooldown();
return;
}

await updateDoc(ref,{
coins:(data.coins || 0) + DAILY_REWARD,
lastClaim:now
});

loadBalance();
checkCooldown();

alert("+8 Mice Coins");

};

async function checkCooldown(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

const data = snap.data();

const now = Date.now();
const remaining = DAILY_COOLDOWN - (now - (data.lastClaim || 0));

const btn = document.getElementById("claimBtn");
const timer = document.getElementById("timer");

if(remaining <= 0){
btn.disabled = false;
timer.innerText = "Ready to claim";
return;
}

btn.disabled = true;

timer.innerText =
Math.floor(remaining/3600000) + "h " +
Math.floor((remaining%3600000)/60000) + "m left";

}

setInterval(checkCooldown,60000);

</script>
