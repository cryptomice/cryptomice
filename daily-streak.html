<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cryptomice Daily Streak</title><style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#050812;
color:white;
}

.header{
padding:15px 20px;
text-align:center;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:24px;
font-weight:bold;
color:#facc15;
}

.nav{
margin-top:10px;
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

.nav a{
text-decoration:none;
color:#d1d5db;
background:#111827;
padding:8px 12px;
border-radius:10px;
font-size:13px;
border:1px solid rgba(255,255,255,0.05);
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.card{
background:#111827;
padding:18px;
border-radius:18px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.05);
}

.balance{
font-size:32px;
color:#facc15;
font-weight:bold;
}

.title{
font-size:18px;
margin-bottom:10px;
font-weight:bold;
}

.small{
font-size:13px;
color:#9ca3af;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:disabled{
opacity:0.5;

}

.badge{
display:inline-block;
padding:5px 10px;
background:#0b1220;
border-radius:50px;
font-size:12px;
margin-right:5px;

}
</style></head><body><div class="header">
<div class="logo">🐭 Cryptomice Daily Streak</div><div class="nav">
<a href="https://cryptomice.github.io/cryptomice/earn.html">Earn Page</a>
<a href="https://cryptomice.github.io/cryptomice/rewards.html">Rewards</a>
</div></div><div class="container"><div class="card">
<div class="small">Your Balance</div>
<div class="balance" id="balance">Loading...</div>
</div><!-- DAILY STREAK --><div class="card">
<div class="title">🔥 Daily Streak Reward</div>
<div class="small">Claim your fixed daily reward of 16 Mice Coins every 24 hours.</div>
<button id="claimBtn" onclick="claimDaily()">Claim 16 Coins</button>
<div class="small" id="timer" style="margin-top:10px;"></div>
</div><!-- NAV BUTTON --><div class="card">
<div class="title">🚀 Go to Earn Page</div>
<div class="small">Continue earning more Mice Coins through offers and tasks.</div>
<button onclick="goEarn()">Open Earn Page</button>
</div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;
const REWARD = 16;
const COOLDOWN = 24 * 60 * 60 * 1000;

onAuthStateChanged(auth, async (u)=>{
if(!u){ window.location.href="auth.html"; return; }
user = u;
await ensureUser();
loadData();
});

async function ensureUser(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);
if(!snap.exists()){
await setDoc(ref,{ email:user.email, coins:0, lastClaim:0 });
}
}

async function loadData(){
await loadBalance();
await updateTimer();
}

async function loadBalance(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);
document.getElementById("balance").innerText = (snap.data()?.coins || 0) + " Mice Coins";
}

window.claimDaily = async function(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);
const data = snap.data();

const now = Date.now();
const last = data.lastClaim || 0;

if(now - last < COOLDOWN){
alert("You already claimed today. Come back later.");
return;
}

const newCoins = (data.coins || 0) + REWARD;

await updateDoc(ref,{ coins:newCoins, lastClaim:now });

loadBalance();
updateTimer();

alert("You received 16 Mice Coins!");
};

window.goEarn = function(){
window.location.href = "https://cryptomice.github.io/cryptomice/earn.html";
};

async function updateTimer(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);
const last = snap.data()?.lastClaim || 0;
const now = Date.now();

const btn = document.getElementById("claimBtn");
const timer = document.getElementById("timer");

if(now - last >= COOLDOWN){
btn.disabled = false;
timer.innerText = "You can claim now.";
return;
}

btn.disabled = true;
const remaining = COOLDOWN - (now - last);

const hrs = Math.floor(remaining / 3600000);
const mins = Math.floor((remaining % 3600000) / 60000);

timer.innerText = `Next claim in ${hrs}h ${mins}m`;
}

setInterval(updateTimer, 60000);

</script></body>
  </html>
