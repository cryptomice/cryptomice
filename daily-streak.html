<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cryptomice Daily Streak</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050812;
font-family:Arial,sans-serif;
color:white;
}

.header{
padding:20px;
text-align:center;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:28px;
font-weight:bold;
color:#facc15;
}

.nav{
margin-top:14px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.nav button{
padding:10px 14px;
border:none;
border-radius:10px;
background:#111827;
color:white;
cursor:pointer;
font-size:13px;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.card{
background:#111827;
padding:20px;
border-radius:18px;
margin-bottom:18px;
border:1px solid rgba(255,255,255,0.05);
}

.balance{
font-size:34px;
font-weight:bold;
color:#facc15;
margin-top:8px;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.small{
font-size:13px;
color:#9ca3af;
line-height:1.6;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:14px;
color:#050812;
font-size:15px;
}

.btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

#loading{
text-align:center;
padding:40px;
color:#9ca3af;
}

#app{
display:none;
}

.timer{
margin-top:12px;
font-size:14px;
color:#facc15;
text-align:center;
}

</style>
</head>

<body>

<div id="loading">
Loading Daily Streak...
</div>

<div id="app">

<div class="header">

<div class="logo">
🐭 Cryptomice Daily Streak
</div>

<div class="nav">

<button onclick="goEarn()">
Earn Page
</button>

<button onclick="goRewards()">
Rewards Hub
</button>

</div>

</div>

<div class="container">

<!-- BALANCE -->
<div class="card">

<div class="small">
Your Balance
</div>

<div class="balance" id="balance">
0 Mice Coins
</div>

</div>

<!-- DAILY CLAIM -->
<div class="card">

<div class="title">
📅 Daily Reward
</div>

<div class="small">
Claim a fixed reward of 16 Mice Coins every 24 hours.
No bonuses. No multipliers.
</div>

<button class="btn" id="claimBtn" onclick="claimDaily()">
CLAIM 16 MICE COINS
</button>

<div class="timer" id="timer">
Checking availability...
</div>

</div>

<!-- RETURN -->
<div class="card">

<div class="title">
🚀 Continue Earning
</div>

<div class="small">
Go back to the main earning system and continue earning Mice Coins.
</div>

<button class="btn" onclick="goEarn()">
OPEN EARN PAGE
</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

let user = null;

const DAILY_REWARD = 16;
const DAILY_COOLDOWN = 86400000;

/* AUTH */
onAuthStateChanged(auth, async (u)=>{

if(!u){
location.replace("auth.html");
return;
}

user = u;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

/* CREATE USER (ONLY OWN DOC) */
if(!snap.exists()){
await setDoc(ref,{
email:user.email,
coins:0,
lastClaim:0,
lastFaucet:0
});
}

document.getElementById("loading").style.display = "none";
document.getElementById("app").style.display = "block";

loadBalance();
checkCooldown();

});

/* BALANCE */
async function loadBalance(){

if(!user) return;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()) return;

document.getElementById("balance").innerText =
(snap.data().coins || 0) + " Mice Coins";

}

/* CLAIM */
window.claimDaily = async function(){

if(!user) return;

const btn = document.getElementById("claimBtn");
btn.disabled = true;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
alert("User not initialized");
return;
}

const data = snap.data();

const now = Date.now();
const lastClaim = data.lastClaim || 0;

if(now - lastClaim < DAILY_COOLDOWN){
alert("Daily reward already claimed.");
checkCooldown();
return;
}

await updateDoc(ref,{
coins:(data.coins || 0) + DAILY_REWARD,
lastClaim:now
});

await loadBalance();

alert("+16 Mice Coins");
checkCooldown();

};

/* COOLDOWN */
async function checkCooldown(){

if(!user) return;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()) return;

const data = snap.data();

const now = Date.now();
const lastClaim = data.lastClaim || 0;

const btn = document.getElementById("claimBtn");
const timer = document.getElementById("timer");

const remaining = DAILY_COOLDOWN - (now - lastClaim);

if(remaining <= 0){
btn.disabled = false;
timer.innerText = "You can claim your 16 Mice Coins now.";
return;
}

btn.disabled = true;

const hours = Math.floor(remaining / 3600000);
const minutes = Math.floor((remaining % 3600000) / 60000);

timer.innerText = "Next claim in " + hours + "h " + minutes + "m";

}

setInterval(checkCooldown,60000);

/* NAV */
window.goEarn = function(){
location.href = "earn.html";
};

window.goRewards = function(){
location.href = "rewards.html";
};

</script>

</body>
  </html>
