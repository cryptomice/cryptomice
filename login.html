<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

/* ================= SAFE LOGIN CHECK ================= */
async function ensureUser(uid, email){

const ref = doc(db,"users",uid);
const snap = await getDoc(ref);

/* AUTO FIX OLD USERS */
if(!snap.exists()){
await setDoc(ref,{
email: email || "unknown",
earnings: 0,
referrals: 0,
createdAt: Date.now(),
accountType: "user"
});
}

return true; // ALWAYS allow login
}

/* AUTO REDIRECT */
onAuthStateChanged(auth, async (user) => {

if(user){
await ensureUser(user.uid, user.email);
window.location.replace("dashboard.html");
}
});

/* LOGIN BUTTON */
document.getElementById("loginBtn").addEventListener("click", async ()=>{

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

const msg = document.getElementById("msg");
const btn = document.getElementById("loginBtn");

if(!email || !password){
msg.innerText = "Enter email and password";
return;
}

try{

btn.innerText = "Logging in...";

const cred = await signInWithEmailAndPassword(auth,email,password);

/* FIX: auto-create missing DB profile */
await ensureUser(cred.user.uid, cred.user.email);

msg.innerText = "Login successful";

setTimeout(()=>{
window.location.replace("dashboard.html");
},700);

}catch(error){

msg.innerText = error.message;
btn.innerText = "LOGIN";

}

});

  </script>
