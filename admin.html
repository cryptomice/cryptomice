<!DOCTYPE html>
<html>
<head>
<title>Cryptomice Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#03060c;
color:white;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(255,215,0,0.15), transparent 40%),
radial-gradient(circle at 80% 60%, rgba(255,215,0,0.08), transparent 50%);
z-index:0;
}

*{position:relative;z-index:1;}

.header{
text-align:center;
padding:15px;
border-bottom:1px solid rgba(255,215,0,0.2);
}

.header h2{
color:#ffd84d;
text-shadow:0 0 15px #ffd84d;
}

.section-title{
margin:20px 15px 10px;
color:#ffd84d;
}

.card{
margin:15px;
padding:15px;
border-radius:12px;
background:#0b1220;
border:1px solid rgba(255,215,0,0.2);
}

.item{
background:#0f172a;
padding:12px;
border-radius:10px;
margin-bottom:10px;
border:1px solid rgba(255,215,0,0.15);
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
font-weight:bold;
}

.approve{background:#00ff88;color:black;}
.delete{background:#ff4d4d;color:white;}
.paid{background:#ffd84d;color:black;}

.badge{
padding:3px 8px;
border-radius:20px;
font-size:11px;
display:inline-block;
margin-top:5px;
}

.pending{background:#ffcc00;color:black;}
.done{background:#00cc66;color:black;}

.empty{
opacity:0.6;
font-size:13px;
padding:10px;
}
</style>
</head>

<body>

<div class="header">
<h2>🐭 CRYPTOMICE ADMIN</h2>
</div>

<!-- ORIGINAL PAYMENTS -->
<h3 class="section-title">💰 Payment Requests</h3>
<div id="payments" class="card"></div>

<!-- ORIGINAL WITHDRAWALS (UNCHANGED SYSTEM) -->
<h3 class="section-title">💸 Withdrawals (Legacy System)</h3>
<div id="withdrawals_old" class="card"></div>

<!-- NEW CRYPTOMICE FREE SECTION -->
<h3 class="section-title">🐭 Cryptomice Free Section Withdrawals</h3>
<div id="withdrawals_free" class="card"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===================== PAYMENTS ===================== */
async function loadPayments(){
const c=document.getElementById("payments");
c.innerHTML="";

const snap=await getDocs(collection(db,"payments"));

if(snap.empty){
c.innerHTML="<div class='empty'>No payments</div>";
return;
}

snap.forEach(d=>{
const x=d.data();

c.innerHTML+=`
<div class="item">
<p><b>Email:</b> ${x.email||"N/A"}</p>
<p><b>TXID:</b> ${x.txid||"N/A"}</p>
<p>Status: ${x.status||"pending"}</p>

<button class="approve" onclick="approve('${d.id}')">Approve</button>
<button class="delete" onclick="delPay('${d.id}')">Delete</button>
</div>
`;
});
}

/* ===================== OLD WITHDRAWALS ===================== */
async function loadOldWithdrawals(){
const c=document.getElementById("withdrawals_old");
c.innerHTML="";

const snap=await getDocs(collection(db,"withdrawals"));

if(snap.empty){
c.innerHTML="<div class='empty'>No legacy withdrawals</div>";
return;
}

snap.forEach(d=>{
const x=d.data();

c.innerHTML+=`
<div class="item">
<p><b>Email:</b> ${x.email||"N/A"}</p>
<p><b>Amount:</b> ${x.amount||0}</p>
<p><b>Wallet:</b> ${x.wallet||"N/A"}</p>

<span class="badge ${x.status==='paid'?'done':'pending'}">
${x.status||"pending"}
</span>

<button class="paid" onclick="markOldPaid('${d.id}')">Mark Paid</button>
<button class="delete" onclick="delOld('${d.id}')">Delete</button>
</div>
`;
});
}

/* ===================== CRYPTOMICE FREE SECTION ===================== */
async function loadFreeWithdrawals(){
const c=document.getElementById("withdrawals_free");
c.innerHTML="";

const snap=await getDocs(collection(db,"free_withdrawals"));

if(snap.empty){
c.innerHTML="<div class='empty'>No Cryptomice Free withdrawals</div>";
return;
}

snap.forEach(d=>{
const x=d.data();

c.innerHTML+=`
<div class="item">
<p><b>User:</b> ${x.email||"N/A"}</p>
<p><b>UID:</b> ${x.uid||"N/A"}</p>
<p><b>Amount:</b> ${x.amount} Mice Coins</p>
<p><b>Wallet:</b> ${x.wallet||"N/A"}</p>

<span class="badge ${x.status==='paid'?'done':'pending'}">
${x.status||"pending"}
</span>

<button class="paid" onclick="markFreePaid('${d.id}')">Mark Paid</button>
<button class="delete" onclick="delFree('${d.id}')">Delete</button>
</div>
`;
});
}

/* ACTIONS */
window.approve=async(id)=>{await updateDoc(doc(db,"payments",id),{status:"approved"});loadPayments();};
window.delPay=async(id)=>{await deleteDoc(doc(db,"payments",id));loadPayments();};

window.markOldPaid=async(id)=>{await updateDoc(doc(db,"withdrawals",id),{status:"paid"});loadOldWithdrawals();};
window.delOld=async(id)=>{await deleteDoc(doc(db,"withdrawals",id));loadOldWithdrawals();};

window.markFreePaid=async(id)=>{await updateDoc(doc(db,"free_withdrawals",id),{status:"paid"});loadFreeWithdrawals();};
window.delFree=async(id)=>{await deleteDoc(doc(db,"free_withdrawals",id));loadFreeWithdrawals();};

/* AUTO REFRESH */
setInterval(()=>{
loadPayments();
loadOldWithdrawals();
loadFreeWithdrawals();
},10000);

/* INIT */
loadPayments();
loadOldWithdrawals();
loadFreeWithdrawals();

</script>

</body>
</html>
