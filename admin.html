<!DOCTYPE html>
<html>
<head>
<title>Cryptomice Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#03060c;
color:white;
}

.header{
text-align:center;
padding:15px;
border-bottom:1px solid rgba(255,215,0,0.2);
}

.header h2{
color:#ffd84d;
text-shadow:0 0 15px #ffd84d;
}

.section-title{
margin:20px 15px 10px;
color:#ffd84d;
}

.card{
margin:15px;
padding:15px;
border-radius:12px;
background:#0b1220;
border:1px solid rgba(255,215,0,0.2);
}

.item{
background:#0f172a;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
margin-top:5px;
font-weight:bold;
}

.approve{background:linear-gradient(90deg,#00ff88,#00cc66);color:black;}
.delete{background:linear-gradient(90deg,#ff4d4d,#cc0000);color:white;}
.paid{background:linear-gradient(90deg,#ffd84d,#ffcc00);color:black;}

.refresh-btn{
margin:10px 15px;
padding:10px;
background:#111827;
border:1px solid #ffd84d;
color:#ffd84d;
border-radius:8px;
cursor:pointer;
}

.empty{
opacity:0.6;
font-size:13px;
padding:10px;
}
</style>
</head>

<body>

<div class="header">
<h2>🐭 CRYPTOMICE ADMIN</h2>
</div>

<button class="refresh-btn" onclick="manualRefresh()">🔄 Refresh Data</button>

<h3 class="section-title">📩 Payment Submissions</h3>
<div id="payments" class="card"></div>

<h3 class="section-title">💸 Withdrawals</h3>
<div id="withdrawals" class="card"></div>

<h3 class="section-title">🐭 Free Withdrawals</h3>
<div id="freeWithdrawals" class="card"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
updateDoc,
deleteDoc,
doc,
setDoc,
increment
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------------- LOAD PAYMENTS ---------------- */
async function loadPayments(){
const container = document.getElementById("payments");
container.innerHTML = "";

const snap = await getDocs(collection(db,"payments"));

if(snap.empty){
container.innerHTML = "<div class='empty'>No submissions</div>";
return;
}

snap.forEach(d=>{
const data = d.data();

container.innerHTML += `
<div class="item">
<p><b>Email:</b> ${data.email}</p>
<p><b>TXID:</b> ${data.txid}</p>
<p><b>Status:</b> ${data.status}</p>

<button class="approve" onclick="approve('${d.id}','${data.email}')">Approve</button>
<button class="delete" onclick="removeItem('${d.id}')">Delete</button>
</div>
`;
});
}

/* ---------------- LOAD WITHDRAWALS ---------------- */
async function loadWithdrawals(){
const container = document.getElementById("withdrawals");
container.innerHTML = "";

const snap = await getDocs(collection(db,"withdrawals"));

if(snap.empty){
container.innerHTML = "<div class='empty'>No withdrawals</div>";
return;
}

snap.forEach(d=>{
const data = d.data();

container.innerHTML += `
<div class="item">
<p><b>Email:</b> ${data.email || "N/A"}</p>
<p><b>Amount:</b> ${data.amount}</p>
<p><b>Wallet:</b> ${data.wallet}</p>

<button class="paid" onclick="markPaid('${d.id}')">Mark Paid</button>
<button class="delete" onclick="deleteWithdraw('${d.id}')">Delete</button>
</div>
`;
});
}

/* ---------------- LOAD FREE WITHDRAWALS ---------------- */
async function loadFreeWithdrawals(){
const container = document.getElementById("freeWithdrawals");
container.innerHTML = "";

const snap = await getDocs(collection(db,"cryptomice_free_withdrawals"));

if(snap.empty){
container.innerHTML = "<div class='empty'>No free withdrawals</div>";
return;
}

snap.forEach(d=>{
const data = d.data();

container.innerHTML += `
<div class="item">
<p><b>User:</b> ${data.uid}</p>
<p><b>Amount:</b> ${data.amount}</p>
<p><b>Wallet:</b> ${data.wallet}</p>
<p><b>Status:</b> ${data.status}</p>

<button class="paid" onclick="markFree('${d.id}')">Mark Paid</button>
<button class="delete" onclick="deleteFree('${d.id}')">Delete</button>
</div>
`;
});
}

/* ---------------- APPROVE + REFERRAL LOGIC ---------------- */

window.approve = async function(id,email){

  // 1. Approve payment
  await updateDoc(doc(db,"payments",id),{
    status:"approved"
  });

  // 2. Unlock user
  await setDoc(doc(db,"approved_users",email),{
    email:email,
    approvedAt: new Date().toISOString()
  });

  // 3. Process referrals
  const snap = await getDocs(collection(db,"referrals"));

  for (const rDoc of snap.docs) {
    const r = rDoc.data();

    if(r.email === email && r.credited === false && r.referrerId){

      const referrerRef = doc(db,"users",r.referrerId);

      await updateDoc(referrerRef,{
        earnings: increment(0.01)
      });

      await updateDoc(doc(db,"referrals",rDoc.id),{
        credited: true
      });
    }
  }

  loadPayments();
};

window.removeItem = async function(id){
await deleteDoc(doc(db,"payments",id));
loadPayments();
};

window.markPaid = async function(id){
await updateDoc(doc(db,"withdrawals",id),{status:"paid"});
loadWithdrawals();
};

window.deleteWithdraw = async function(id){
await deleteDoc(doc(db,"withdrawals",id));
loadWithdrawals();
};

window.markFree = async function(id){
await updateDoc(doc(db,"cryptomice_free_withdrawals",id),{status:"paid"});
loadFreeWithdrawals();
};

window.deleteFree = async function(id){
await deleteDoc(doc(db,"cryptomice_free_withdrawals",id));
loadFreeWithdrawals();
};

window.manualRefresh = function(){
loadPayments();
loadWithdrawals();
loadFreeWithdrawals();
};

/* INIT */
loadPayments();
loadWithdrawals();
loadFreeWithdrawals();

</script>

</body>
  </html>
