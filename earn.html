<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice Earn System</title>

<style>
body{margin:0;background:#050812;color:white;font-family:Arial;}

.header{text-align:center;padding:20px;background:#0b1220;}
.logo{color:#facc15;font-size:28px;font-weight:bold;}

.box{margin:20px;padding:20px;background:#111827;border-radius:16px;}
.balance{font-size:34px;color:#facc15;}

.task{margin:20px;padding:20px;background:#0f172a;border-radius:16px;}

.small{font-size:13px;color:#9ca3af;}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:10px;
color:#050812;
}

#loading{
text-align:center;
padding:40px;
color:#9ca3af;
}

#app{display:none;}
</style>
</head>

<body>

<div id="loading">Loading Cryptomice...</div>

<div id="app">

<div class="header">
<div class="logo">🐭 Cryptomice Earn</div>
</div>

<div class="box">
<div>Balance</div>
<div class="balance" id="balance">0 Mice Coins</div>
</div>

<div class="task">
<h3>🎯 Earn Ads</h3>
<div class="small">Click ads and earn Mice Coins</div>
<button class="btn" onclick="startAd()">START AD</button>
</div>

<div class="task">
<h3>🎮 Offer Wall</h3>
<div class="small">Surveys, installs & games</div>
<button class="btn" onclick="openOfferWall()">OPEN OFFER WALL</button>
</div>

<div class="task">
<h3>🚰 Faucet</h3>
<div class="small">Claim once every 24h</div>
<button class="btn" onclick="claimFaucet()">CLAIM FAUCET</button>
</div>

<div class="task">
<h3>📅 Daily Streak</h3>
<div class="small">Build streak rewards</div>
<button class="btn" onclick="openStreak()">OPEN STREAK</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(()=>{});

/* SAFE STATE */
let user = null;
let ready = false;

/* 🔥 TIMEOUT FIX (prevents infinite loading) */
setTimeout(() => {
if(!ready){
document.getElementById("loading").innerText =
"Loading failed. Please refresh.";
}
}, 3000);

/* AUTH */
onAuthStateChanged(auth, async (u) => {

ready = true;

if(!u){
location.replace("auth.html");
return;
}

user = u;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
coins:0,
lastFaucet:0,
streak:0,
lastStreak:0
});
}

document.getElementById("loading").style.display = "none";
document.getElementById("app").style.display = "block";

loadBalance();

});

/* LOAD */
async function loadBalance(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

document.getElementById("balance").innerText =
(snap.data()?.coins || 0) + " Mice Coins";
}

/* REWARD */
async function reward(amount){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

let c = snap.data().coins || 0;
c += amount;

await updateDoc(ref,{coins:c});
loadBalance();
}

/* ADS */
const ads = [
"https://wrathful-piano.com/VFOZNk",
"https://wrathful-piano.com/rIiayv",
"https://thoroughgear.com/jVLBPd",
"https://thoroughgear.com/TpOLka",
"https://www.profitablecpmratenetwork.com/s8k5ehp1?key=45d4890534ac4bbaeb9f23b2da7ae0c4",
"https://www.profitablecpmratenetwork.com/ix64kcqv?key=513b6a1c69d3509f2f492583b4ca2e4f"
];

let active=false;
let start=0;
let lastAd=0;

window.startAd=function(){

if(!user) return;

if(Date.now()-lastAd<30000){
alert("Cooldown active");
return;
}

window.open(ads[Math.floor(Math.random()*ads.length)],"_blank");

active=true;
start=Date.now();
lastAd=Date.now();

};

/* FIXED CHEAT SYSTEM */
document.addEventListener("visibilitychange", async ()=>{

if(document.visibilityState==="visible" && active){

active=false;

let t=(Date.now()-start)/1000;

if(t<8){
alert("Invalid session");
return;
}

await reward(10);
alert("+10 Coins Earned");
}

});

/* OFFER WALL (FIXED LINK) */
window.openOfferWall=function(){
location.href="rewards.html";
};

/* DAILY STREAK LINK */
window.openStreak=function(){
location.href="daily-streak.html";
};

/* FAUCET */
window.claimFaucet=async function(){

const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

let data=snap.data();
let now=Date.now();

if(now-(data.lastFaucet||0)<86400000){
alert("Come back later");
return;
}

await updateDoc(ref,{
coins:(data.coins||0)+20,
lastFaucet:now
});

loadBalance();
alert("+20 Faucet");
};

</script>

</body>
</html>
