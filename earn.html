<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice Earn System</title>

<style>
body{margin:0;background:#050812;color:white;font-family:Arial;}
.header{text-align:center;padding:20px;background:#0b1220;}
.logo{color:#facc15;font-size:28px;font-weight:bold;}

.box{margin:20px;padding:20px;background:#111827;border-radius:16px;}
.balance{font-size:34px;color:#facc15;}

.task{margin:20px;padding:20px;background:#0f172a;border-radius:16px;}
.small{font-size:13px;color:#9ca3af;}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:10px;
color:#050812;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#111827;
color:white;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🐭 Cryptomice Earn</div>
</div>

<div class="box">
<div>Balance</div>
<div class="balance" id="balance">Loading...</div>
</div>

<!-- ADS -->
<div class="task">
<h3>🎯 Earn Ads</h3>
<div class="small">Watch ads and earn Mice Coins</div>
<button class="btn" onclick="startAd()">START AD</button>
</div>

<!-- OFFER WALL -->
<div class="task">
<h3>🎮 Offer Wall</h3>
<div class="small">Surveys, installs & games</div>
<button class="btn" onclick="openOfferWall()">OPEN OFFER WALL</button>
</div>

<!-- FAUCET -->
<div class="task">
<h3>🚰 Faucet</h3>
<div class="small">Claim free coins every 24 hours</div>
<button class="btn" onclick="claimFaucet()">CLAIM FAUCET</button>
</div>

<!-- WITHDRAW -->
<div class="task">
<h3>💸 Withdraw</h3>
<div class="small">Minimum withdrawal: 1000 Coins</div>

<input id="wallet" placeholder="Enter Litecoin Wallet Address">

<button class="btn" onclick="withdraw()">WITHDRAW</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

let user = null;
let authReady = false;

/* 🔥 FIX: prevent redirect flicker */
onAuthStateChanged(auth, async (u) => {

authReady = true;

if (!u) {
if (authReady) {
window.location.href = "auth.html";
}
return;
}

user = u;

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (!snap.exists()) {
await setDoc(ref, { coins: 0 });
}

load();

});

/* LOAD */
async function load() {
const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

document.getElementById("balance").innerText =
(snap.data()?.coins || 0);
}

/* REWARD */
async function reward(amount) {
const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

let c = snap.data().coins || 0;
c += amount;

await updateDoc(ref, { coins: c });
load();
}

/* ADS */
const ads = [
"https://wrathful-piano.com/VFOZNk",
"https://wrathful-piano.com/rIiayv",
"https://thoroughgear.com/jVLBPd",
"https://thoroughgear.com/TpOLka"
];

let active = false;
let start = 0;
let lastAd = 0;

window.startAd = function () {

if (Date.now() - lastAd < 30000) {
alert("Cooldown active");
return;
}

let link = ads[Math.floor(Math.random() * ads.length)];
window.open(link, "_blank");

active = true;
start = Date.now();
lastAd = Date.now();

alert("Stay a few seconds then return");
};

/* CHEAT PROTECTION */
document.addEventListener("visibilitychange", async () => {

if (document.visibilityState === "visible" && active) {

let time = (Date.now() - start) / 1000;

if (time < 8) {
active = false;
alert("Invalid session");
return;
}

active = false;
await reward(10);
alert("+10 Coins Earned");
}
});

/* OFFER WALL */
window.openOfferWall = function () {
window.location.href = "rewards.html";
};

/* FAUCET */
window.claimFaucet = async function () {

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

let data = snap.data();
let now = Date.now();

if (data.lastFaucet && now - data.lastFaucet < 86400000) {
alert("Come back later");
return;
}

await updateDoc(ref, {
coins: (data.coins || 0) + 20,
lastFaucet: now
});

load();
alert("+20 Faucet");
};

/* WITHDRAW */
window.withdraw = async function () {

let wallet = document.getElementById("wallet").value;

if (!wallet) {
alert("Enter wallet");
return;
}

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

let coins = snap.data().coins || 0;

if (coins < 1000) {
alert("Minimum 1000 coins required");
return;
}

await addDoc(collection(db, "withdrawals"), {
uid: user.uid,
wallet: wallet,
amount: coins,
status: "pending",
time: Date.now()
});

await updateDoc(ref, { coins: 0 });

load();
alert("Withdrawal submitted!");
};

</script>

</body>
</html>
