<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice Earn System</title>

<style>
body{margin:0;background:#050812;color:white;font-family:Arial;}
.header{text-align:center;padding:20px;background:#0b1220;}
.logo{color:#facc15;font-size:28px;font-weight:bold;}

.box{margin:20px;padding:20px;background:#111827;border-radius:16px;}
.balance{font-size:34px;color:#facc15;}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.task{margin:20px;padding:20px;background:#0f172a;border-radius:16px;}
.small{font-size:13px;color:#9ca3af;}
</style>
</head>

<body>

<div class="header">
<div class="logo">🐭 Cryptomice</div>
</div>

<div class="box">
<div>Balance</div>
<div class="balance" id="balance">0</div>
</div>

<div class="task">
<h3>🎯 Watch Ads</h3>
<div class="small">Stay focused for reward</div>
<button class="btn" onclick="startAd()">START AD</button>
</div>

<div class="task">
<h3>🚰 Faucet</h3>
<div class="small">Claim once every 24h</div>
<button class="btn" onclick="claimFaucet()">CLAIM FAUCET</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

let user=null;

/* ---------------- AD POOLS ---------------- */
const adsA = [
"https://wrathful-piano.com/VFOZNk",
"https://wrathful-piano.com/rIiayv",
"https://thoroughgear.com/jVLBPd",
"https://thoroughgear.com/TpOLka"
];

const adsB = [
"https://www.profitablecpmratenetwork.com/s8k5ehp1?key=45d4890534ac4bbaeb9f23b2da7ae0c4",
"https://www.profitablecpmratenetwork.com/ix64kcqv?key=513b6a1c69d3509f2f492583b4ca2e4f",
"https://www.profitablecpmratenetwork.com/mh7etds8ti?key=e5d712029b02ef37b39eaa5a23b6d2cb"
];

let active=false;
let start=0;
let focus=0;
let lastAd=0;

/* ---------------- AUTH ---------------- */
onAuthStateChanged(auth, async (u)=>{
if(!u){location.href="auth.html";return;}
user=u;

const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{coins:0});
}

load();
});

/* ---------------- LOAD ---------------- */
async function load(){
const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);
document.getElementById("balance").innerText=snap.data().coins||0;
}

/* ---------------- REWARD ---------------- */
async function reward(amount){
const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

let c=snap.data().coins||0;
c+=amount;

await updateDoc(ref,{coins:c});
load();
}

/* ---------------- AD SYSTEM ---------------- */
window.startAd=function(){

let now=Date.now();

if(now-lastAd<30000){
alert("Wait cooldown");
return;
}

/* pool mix */
let pool=Math.random()>0.5?adsA:adsB;
let link=pool[Math.floor(Math.random()*pool.length)];

window.open(link,"_blank");

active=true;
start=now;
focus=0;
lastAd=now;

/* track focus */
setInterval(()=>{
if(document.visibilityState==="visible") focus++;
},1000);

alert("Stay on page to earn reward");
};

/* ---------------- ANTI CHEAT ---------------- */
document.addEventListener("visibilitychange",async()=>{

if(document.visibilityState==="visible"&&active){

let t=(Date.now()-start)/1000;

if(t<8||focus<5){
active=false;
alert("Invalid session");
return;
}

active=false;
await reward(10);
alert("+10 Coins Earned");
}
});

/* ---------------- FAUCET ---------------- */
window.claimFaucet=async function(){

const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

let data=snap.data();
let now=Date.now();
let day=86400000;

if(data.lastFaucet && now-data.lastFaucet<day){
alert("Come back later");
return;
}

await updateDoc(ref,{
coins:(data.coins||0)+20,
lastFaucet:now
});

load();
alert("+20 Faucet Claimed");
};

</script>

</body>
  </html>
