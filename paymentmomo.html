<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<meta name="admaven-placement" content="Bqjs5qdC4">

<title>Cryptomice Payment</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0a0a0a;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.logo{
text-align:center;
font-size:40px;
font-weight:bold;
color:#FFD700;
margin-bottom:20px;
text-shadow:0 0 15px #FFD700;
}

.card{
background:#111;
border:2px solid #FFD700;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.price{
font-size:28px;
color:#FFD700;
font-weight:bold;
}

.address{
background:#1b1b1b;
padding:12px;
border-radius:10px;
word-break:break-all;
margin-top:10px;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:10px;
border:none;
background:#1b1b1b;
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#FFD700;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffea75;
}

.notice{
font-size:13px;
color:#bbb;
text-align:center;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">CRYPTOMICE</div>

<div class="card">
<h2>Activate Account</h2>
<div class="price">20 ZMW</div>
</div>

<div class="card">
<h3>Litecoin Payment</h3>
<div class="address">ltc1q6e2ad703p0sx5pe2hz8qrqylnp05vy5wkxc4u5</div>
</div>

<div class="card">
<h3>Payment Form</h3>

<form id="paymentForm">

<input id="username" type="text" placeholder="Username" required>
<input id="phone" type="text" placeholder="Phone Number" required>
<input id="txid" type="text" placeholder="Payment TXID / Proof" required>

<button type="submit">Submit Payment</button>

</form>

<div class="notice">
Your payment will be verified shortly.
</div>

</div>

</div>

<!-- FIREBASE (STABLE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* WAIT FOR DOM */
document.addEventListener("DOMContentLoaded", () => {

const form = document.getElementById("paymentForm");

form.addEventListener("submit", async (e) => {
e.preventDefault();

const username = document.getElementById("username").value.trim();
const phone = document.getElementById("phone").value.trim();
const txid = document.getElementById("txid").value.trim();

console.log("INPUTS:", { username, phone, txid });

if (!username || !phone || !txid) {
alert("Missing information. Fill all fields.");
return;
}

try {
await addDoc(collection(db, "payments"), {
email: username,
phone: phone,
txid: txid,
proof: txid,
status: "pending",
createdAt: new Date().toISOString()
});

alert("Payment submitted successfully!");
form.reset();

} catch (error) {
console.error("Firebase Error:", error);
alert(error.message);
}

});

});
</script>

</body>
</html>
