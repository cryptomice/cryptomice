<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Cryptomice Free Tasks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050812;
color:white;
padding:20px;
}

.header{
background:#111827;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#ffd84d;
font-size:22px;
font-weight:bold;
}

button{
background:#ffd84d;
border:none;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:900px;
margin:20px auto;
}

.welcome{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid rgba(255,216,77,.15);
}

.card h3{
color:#ffd84d;
margin-bottom:10px;
}

.value{
font-size:25px;
font-weight:bold;
}

.progress{
background:#1f2937;
height:20px;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.bar{
height:100%;
width:0%;
background:#ffd84d;
}

.actions{
margin-top:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.action{
background:#1f2937;
padding:20px;
border-radius:12px;
text-align:center;
}

a{
color:#ffd84d;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
🐭 Cryptomice Free Tasks
</div>

<button id="logout">
Logout
</button>

</div>


<div class="container">


<div class="welcome">

<h2>
Welcome, <span id="username">User</span>
</h2>

<p id="email">
Loading account...
</p>

</div>


<div class="cards">


<div class="card">
<h3>Balance</h3>
<div class="value">$<span id="balance">0.00</span></div>
</div>


<div class="card">
<h3>Approved Tasks</h3>
<div class="value" id="approved">0</div>
</div>


<div class="card">
<h3>Pending</h3>
<div class="value" id="pending">0</div>
</div>


<div class="card">
<h3>Completed</h3>
<div class="value" id="completed">0</div>
</div>


</div>


<div class="card" style="margin-top:20px;">

<h3>Withdrawal Progress</h3>

<p>
Minimum withdrawal: $5.00
</p>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

</div>


<div class="actions">

<div class="action">
<h3>Tasks</h3>
<a href="ft-tasks.html">View Tasks</a>
</div>


<div class="action">
<h3>Withdraw</h3>
<a href="ft-withdraw.html">Request Payment</a>
</div>


<div class="action">
<h3>Profile</h3>
<a href="ft-profile.html">Account Settings</a>
</div>


</div>


</div>


<script type="module">

import {initializeApp} 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);



onAuthStateChanged(auth,async(user)=>{


if(!user){

window.location.href="ft-login.html";

return;

}


const ref=doc(db,"ft_users",user.uid);

const snap=await getDoc(ref);


if(snap.exists()){


const data=snap.data();


document.getElementById("username").innerText=data.fullname || "User";

document.getElementById("email").innerText=data.email;

document.getElementById("balance").innerText=(data.balance || 0).toFixed(2);

document.getElementById("approved").innerText=data.approvedTasks || 0;

document.getElementById("pending").innerText=data.pendingTasks || 0;

document.getElementById("completed").innerText=data.completedTasks || 0;


let percent=((data.balance || 0)/5)*100;

if(percent>100) percent=100;


document.getElementById("progressBar").style.width=percent+"%";


}


});



document.getElementById("logout").onclick=()=>{

signOut(auth);

};



</script>


</body>
  </html>
