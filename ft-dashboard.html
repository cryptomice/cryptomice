<!DOCTYPE html>
<html>
<head>
<title>Cryptomice Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#03060c;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(255,215,0,0.15), transparent 40%),
radial-gradient(circle at 80% 60%, rgba(255,215,0,0.08), transparent 50%);
animation:move 8s infinite alternate;
z-index:0;
}

@keyframes move{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

*{
position:relative;
z-index:1;
}

.header{
text-align:center;
padding:15px;
border-bottom:1px solid rgba(255,215,0,0.2);
}

.header h2{
color:#ffd84d;
text-shadow:0 0 15px #ffd84d;
}

.card{
margin:15px;
padding:15px;
border-radius:12px;
background:#0b1220;
border:1px solid rgba(255,215,0,0.2);
}

.balance{
font-size:34px;
color:#ffd84d;
text-align:center;
}

.small{
font-size:12px;
opacity:0.7;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:1px solid rgba(255,215,0,0.2);
background:#0f172a;
color:white;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.primary{
background:linear-gradient(90deg,#ffd84d,#ffcc00);
color:black;
}

.secondary{
background:#1f2937;
color:white;
}

.ref-box{
background:#0f172a;
padding:10px;
border-radius:8px;
word-break:break-all;
}

.stats{
display:flex;
justify-content:space-between;
text-align:center;
}

.stat h3{
color:#ffd84d;
margin:0;
}

.msg{
font-size:13px;
margin-top:8px;
}
</style>

</head>

<body>

<div class="header">
<h2>🐭 CRYPTOMICE DASHBOARD</h2>
<p id="userEmail">Loading...</p>
</div>


<div class="card">
<div class="small">Available Earnings</div>
<div class="balance">LTC <span id="earnings">0</span></div>
</div>


<div class="card">
<h3>Your Referral Link</h3>
<div id="refLink" class="ref-box">Loading...</div>
<button class="secondary" onclick="copyLink()">Copy Link</button>
</div>


<div class="card">
<h3>Stats</h3>

<div class="stats">

<div class="stat">
<h3 id="refCount">0</h3>
<p>Referrals</p>
</div>

<div class="stat">
<h3>0.01 LTC</h3>
<p>Per Signup</p>
</div>

</div>
</div>


<div class="card">

<h3>Withdraw (Litecoin)</h3>

<p class="small">
Minimum withdrawal: 0.01 LTC
</p>

<input id="withdrawAmount" type="number" placeholder="Enter amount">

<input id="withdrawWallet" placeholder="Enter LTC wallet">


<button id="withdrawBtn" class="primary">
Request Withdrawal
</button>

<p id="withdrawMsg" class="msg"></p>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const BASE = "https://cryptomice.github.io/cryptomice/";


function setText(id,value){

const el=document.getElementById(id);

if(el){

el.innerText=value;

}

}


function go(page){

window.location.href=page;

}


function getRefLink(uid){

return `${BASE}payment.html?ref=${uid}`;

}


onAuthStateChanged(auth, async(user)=>{


try{


if(!user){

go("ft-login.html");

return;

}


setText(
"userEmail",
"Logged in as: "+user.email
);



const userRef=doc(
db,
"ft_users",
user.uid
);


let snap=await getDoc(userRef);



if(!snap.exists()){

await setDoc(userRef,{

email:user.email,

earnings:0,

referrals:0,

createdAt:serverTimestamp()

});


snap=await getDoc(userRef);

}


const data=snap.data() || {};

setText(
"refLink",
getRefLink(user.uid)
);


setText(
"refCount",
data.referrals || 0
);


setText(
"earnings",
data.earnings || 0
);


localStorage.setItem(
"cryptomice_referrer",
user.uid
);


}catch(e){

console.error(e);

setText(
"userEmail",
"Dashboard error"
);

}


});
  /* COPY LINK */

window.copyLink=function(){

const el=document.getElementById("refLink");

if(!el) return;

navigator.clipboard.writeText(el.innerText);

alert("Copied!");

};





/* WITHDRAW */

document.addEventListener("DOMContentLoaded",()=>{


const btn=document.getElementById("withdrawBtn");


if(!btn) return;



btn.addEventListener("click",async()=>{


const amount=parseFloat(
document.getElementById("withdrawAmount").value
);


const wallet=document
.getElementById("withdrawWallet")
.value
.trim();



const msg=document.getElementById("withdrawMsg");



try{


if(!auth.currentUser){

msg.innerText="Not logged in";

return;

}



msg.innerText="Processing...";



if(!amount || amount < 0.01){

msg.innerText="Minimum 0.01 LTC";

return;

}



if(!wallet){

msg.innerText="Enter wallet";

return;

}



const userRef=doc(
db,
"ft_users",
auth.currentUser.uid
);



const snap=await getDoc(userRef);



if(!snap.exists()){

msg.innerText="Account missing";

return;

}



const data=snap.data();


const earnings=data.earnings || 0;



if(amount > earnings){

msg.innerText="Insufficient balance";

return;

}





await addDoc(
collection(db,"withdrawals"),
{

userId:auth.currentUser.uid,

email:auth.currentUser.email,

amount:amount,

wallet:wallet,

coin:"LTC",

status:"pending",

createdAt:serverTimestamp()

}

);





await updateDoc(
userRef,
{

earnings:earnings-amount

}

);





setText(
"earnings",
earnings-amount
);



msg.style.color="lime";

msg.innerText="Withdrawal sent";





}catch(e){


console.error(e);

msg.innerText=e.message;


}



});



});


</script>

</body>

</html>
