<!DOCTYPE html>
<html>
<head>

<title>Cryptomice Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#03060c;
color:white;
}

.header{
text-align:center;
padding:20px;
border-bottom:1px solid #333;
}

.header h2{
color:#ffd84d;
}

.card{
margin:15px;
padding:15px;
border-radius:12px;
background:#0b1220;
}

.balance{
font-size:35px;
color:#ffd84d;
text-align:center;
}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-top:10px;
font-weight:bold;
cursor:pointer;

}

.primary{

background:#ffd84d;
color:black;

}

.secondary{

background:#1f2937;
color:white;

}

input{

width:100%;
padding:12px;
margin-top:8px;
background:#111827;
border:none;
border-radius:8px;
color:white;

}

.small{

font-size:13px;
color:#aaa;

}

</style>

</head>


<body>


<div class="header">

<h2>🐭 CRYPTOMICE DASHBOARD</h2>

<p id="userEmail">
Loading user...
</p>


<button class="secondary" id="logoutBtn">
Logout
</button>


</div>



<div class="card">

<div class="small">
Available Balance
</div>


<div class="balance">

LTC <span id="balance">0</span>

</div>


</div>




<div class="card">

<h3>
Referral Link
</h3>


<p id="refLink">
Loading...
</p>


<button class="secondary" id="copyBtn">
Copy Link
</button>


</div>





<div class="card">

<h3>
Statistics
</h3>


<p>
Referrals:
<span id="referrals">0</span>
</p>


</div>





<div class="card">


<h3>
Withdraw Litecoin
</h3>


<p class="small">
Minimum withdrawal: 0.01 LTC
</p>



<input 
id="amount"
type="number"
placeholder="Amount LTC">



<input
id="wallet"
placeholder="Litecoin wallet">



<button 
class="primary"
id="withdrawBtn">

Request Withdrawal

</button>


<p id="message"></p>



</div>





<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";



import {

getAuth,

onAuthStateChanged,

signOut

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";



import {

getFirestore,

doc,

getDoc,

addDoc,

collection,

updateDoc,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";





const firebaseConfig={


apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"


};




const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getFirestore(app);





let currentUser=null;



const base="https://cryptomice.github.io/cryptomice/";




onAuthStateChanged(auth,async(user)=>{


if(!user){


window.location.href="ft-login.html";

return;


}



currentUser=user;



document.getElementById("userEmail").innerText=
user.email;



const userRef=doc(db,"ft_users",user.uid);



const snap=await getDoc(userRef);



if(!snap.exists()){


document.getElementById("userEmail").innerText=
"User profile missing";


return;


}



const data=snap.data();



document.getElementById("balance").innerText=
data.balance || 0;



document.getElementById("referrals").innerText=
data.referrals || 0;



document.getElementById("refLink").innerText=
base+"ft-signup.html?ref="+user.uid;



});







document.getElementById("logoutBtn")
.onclick=async()=>{


await signOut(auth);


window.location.href="ft-login.html";


};





document.getElementById("copyBtn")
.onclick=()=>{


navigator.clipboard.writeText(
document.getElementById("refLink").innerText
);


alert("Copied");


};







document.getElementById("withdrawBtn")
.onclick=async()=>{


const amount=parseFloat(
document.getElementById("amount").value
);


const wallet=
document.getElementById("wallet").value.trim();


const message=
document.getElementById("message");



if(!currentUser){

message.innerText="Not logged in";

return;

}



if(!amount || amount<0.01){

message.innerText="Minimum withdrawal is 0.01 LTC";

return;

}



if(!wallet){

message.innerText="Enter wallet address";

return;

}





const ref=doc(
db,
"ft_users",
currentUser.uid
);



const snap=await getDoc(ref);



const data=snap.data();



if(amount>data.balance){


message.innerText="Insufficient balance";

return;


}



await addDoc(
collection(db,"withdrawals"),
{


userId:currentUser.uid,

email:currentUser.email,

amount:amount,

wallet:wallet,

status:"pending",

createdAt:serverTimestamp()


});




await updateDoc(ref,{

balance:data.balance-amount

});



document.getElementById("balance").innerText=
data.balance-amount;



message.innerText="Withdrawal request sent";


};



</script>


</body>
</html>
