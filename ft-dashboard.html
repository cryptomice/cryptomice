<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Cryptomice Free Tasks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050812;
color:white;
padding:20px;
}

.header{
background:#111827;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#ffd84d;
font-size:22px;
font-weight:bold;
}

button{
background:#ffd84d;
border:none;
padding:10px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:900px;
margin:20px auto;
}

.welcome,
.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid rgba(255,216,77,.15);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card h3{
color:#ffd84d;
margin-bottom:10px;
}

.value{
font-size:25px;
font-weight:bold;
}

.progress{
background:#1f2937;
height:20px;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#ffd84d;
transition:.5s;
}

.actions{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.action{
background:#1f2937;
padding:20px;
border-radius:12px;
text-align:center;
}

a{
color:#ffd84d;
text-decoration:none;
font-weight:bold;
}

</style>

</head>


<body>


<div class="header">

<div class="logo">
🐭 Cryptomice Free Tasks
</div>


<button id="logout">
Logout
</button>


</div>



<div class="container">


<div class="welcome">

<h2>
Welcome, <span id="username">User</span>
</h2>


<p id="email">
Loading...
</p>


</div>



<div class="cards">


<div class="card">

<h3>
Balance
</h3>

<div class="value">
$<span id="balance">0.00</span>
</div>

</div>



<div class="card">

<h3>
Approved Tasks
</h3>

<div class="value" id="approved">
0
</div>

</div>



<div class="card">

<h3>
Pending
</h3>

<div class="value" id="pending">
0
</div>

</div>



<div class="card">

<h3>
Completed
</h3>

<div class="value" id="completed">
0
</div>

</div>


</div>
<div class="card">

<h3>
Progress
</h3>

<p>
Minimum withdrawal: $800
</p>


<div class="progress">

<div class="bar" id="progressBar"></div>

</div>


</div>




<div class="actions">


<div class="action">

<h3>
Tasks
</h3>

<a href="ft-tasks.html">
View Tasks
</a>

</div>



<div class="action">

<h3>
Profile
</h3>

<a href="ft-profile.html">
Account
</a>

</div>



<div class="action">

<h3>
Withdraw
</h3>

<a href="ft-withdraw.html">
Request
</a>

</div>



</div>



</div>




<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";



import {

getAuth,

onAuthStateChanged,

signOut,

setPersistence,

browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";



import {

getFirestore,

doc,

getDoc

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";





const firebaseConfig={


apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",


authDomain:"cryptomice-635eb.firebaseapp.com",


projectId:"cryptomice-635eb",


storageBucket:"cryptomice-635eb.firebasestorage.app",


messagingSenderId:"831908710470",


appId:"1:831908710470:web:e95e1bdacb90309a046247"


};




const app=initializeApp(firebaseConfig);



const auth=getAuth(app);



const db=getFirestore(app);




await setPersistence(

auth,

browserLocalPersistence

);




onAuthStateChanged(auth,async(user)=>{


try{


if(!user){


window.location.href="ft-login.html";


return;


}




const userRef = doc(
db,
"ft_users",
user.uid
);




const snap=await getDoc(userRef);




if(!snap.exists()){


console.log("User document missing");


return;


}




const data=snap.data();




document.getElementById("username").innerText =

data.fullname || "User";



document.getElementById("email").innerText =

data.email || user.email;



const balance=Number(data.balance || 0);



document.getElementById("balance").innerText =

balance.toFixed(2);



document.getElementById("approved").innerText =

data.approvedTasks || 0;



document.getElementById("pending").innerText =

data.pendingTasks || 0;



document.getElementById("completed").innerText =

data.completedTasks || 0;



let percent=(balance/5)*100;



if(percent>100){

percent=100;

}



document.getElementById("progressBar").style.width=

percent+"%";



}catch(error){


console.error("Dashboard error:",error);


}



});
  document.getElementById("logout").onclick=async()=>{


await signOut(auth);


window.location.href="ft-login.html";


};


</script>


</body>

</html>
