<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* SAME STYLES (UNCHANGED FOR SAFETY) */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#050812;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,215,0,0.18), transparent 40%),
radial-gradient(circle at 80% 60%, rgba(255,215,0,0.10), transparent 45%),
radial-gradient(circle at 40% 80%, rgba(255,255,255,0.06), transparent 50%);
animation:goldFlow 8s infinite alternate ease-in-out;
pointer-events:none;
z-index:0;
}

@keyframes goldFlow{
0%{transform:scale(1) rotate(0deg);}
100%{transform:scale(1.15) rotate(2deg);}
}

*{position:relative;z-index:1;}

.header{
padding:15px;
text-align:center;
background:rgba(17,24,39,0.8);
border-bottom:1px solid rgba(255,215,0,0.15);
}

.header h2{
margin:0;
color:#ffd84d;
text-shadow:0 0 15px #ffd84d;
}

.container{
max-width:500px;
margin:20px auto;
padding:15px;
overflow:hidden;
}

.card{
background:rgba(11,18,32,0.92);
border:1px solid rgba(255,215,0,0.15);
border-radius:14px;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:1px solid rgba(255,215,0,0.15);
background:#0f172a;
color:white;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
background:linear-gradient(90deg,#ffd84d,#ffcc00,#fff2a6);
color:black;
}
</style>
</head>

<body>

<div class="header">
<h2>🐭 CRYPTOMICE</h2>
</div>

<div class="container">

<div class="card">

<h3>Create Account</h3>

<input id="email" placeholder="Enter approved email">
<input id="password" type="password" placeholder="Create password">

<button id="signupBtn">Create Account</button>

<p id="msg"></p>

</div>

</div>

<!-- ✅ SMART LINK ENGINE (GLOBAL ROUTER) -->
<script src="smartlink.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
collection,
addDoc,
increment
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",
authDomain: "cryptomice-635eb.firebaseapp.com",
projectId: "cryptomice-635eb",
storageBucket: "cryptomice-635eb.firebasestorage.app",
messagingSenderId: "831908710470",
appId: "1:831908710470:web:e95e1bdacb90309a046247"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ref = localStorage.getItem("referrer");

document.getElementById("signupBtn").addEventListener("click", async () => {

const email = document.getElementById("email").value.trim().toLowerCase();
const password = document.getElementById("password").value.trim();
const msg = document.getElementById("msg");

if (!email || !password) {
msg.innerText = "Fill all fields";
msg.style.color = "red";
return;
}

try {

const userCred = await createUserWithEmailAndPassword(auth,email,password);
const uid = userCred.user.uid;

await setDoc(doc(db,"users",uid),{
email,
referrals:0,
earnings:0,
createdAt:new Date()
});

/* REFERRAL LOGIC (UNCHANGED) */
if (ref) {
await addDoc(collection(db,"referrals"),{
referrerId: ref,
newUserId: uid,
email,
createdAt: new Date(),
credited: true
});

await setDoc(doc(db,"users",ref),{
referrals: increment(1),
earnings: increment(1)
},{ merge:true });

localStorage.removeItem("referrer");
}

/* AFTER SUCCESS → USE SMART NAV */
msg.style.color="#ffd84d";
msg.innerText="Account created";

setTimeout(()=>{
smartNavigate("earn.html");
},1000);

}catch(e){
msg.style.color="red";
msg.innerText=e.message;
}

});
</script>

</body>
</html>
