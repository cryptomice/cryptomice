<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Cryptomice is a referral-based digital rewards platform where users earn crypto rewards through engagement and referrals.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd84d">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#03060c;
color:white;
overflow-x:hidden;
}

/* BACKGROUND EFFECT */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,215,0,0.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08), transparent 45%);
animation:move 8s infinite alternate;
z-index:0;
}

@keyframes move{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

*{position:relative;z-index:1;}

/* HERO */
.hero{
padding:20px;
text-align:center;
background:radial-gradient(circle at top,#0b1f3a,#03060c);
}

.logo{
font-size:26px;
font-weight:bold;
color:#ffd84d;
}

.hero-img{
width:100%;
max-width:400px;
margin:20px auto;
display:block;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.25);
}

.title{
font-size:30px;
font-weight:bold;
}

.highlight{color:#ffd84d;}

.desc{
font-size:14px;
opacity:0.9;
margin-top:10px;
}

/* BUTTONS */
.buttons button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.activate{
background:linear-gradient(90deg,#ffd84d,#ffcc00);
color:black;
}

.login{
background:#0f172a;
color:white;
}

/* DOWNLOAD BUTTON */
#installBtn{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#ffd84d,#ffcc00);
color:black;
display:block;
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
padding:15px;
background:#0b1220;
text-align:center;
}

/* FOOTER */
.footer-links{
text-align:center;
margin-top:20px;
font-size:13px;
}

.footer-links a{
color:#ffd84d;
text-decoration:none;
margin:0 5px;
}

.footer{
text-align:center;
font-size:12px;
opacity:0.5;
margin:20px;
}

</style>

</head>

<body>

<!-- HERO -->
<div class="hero">

<div class="logo">🐭 CRYPTOMICE</div>

<!-- 🔥 YOUR ORIGINAL IMAGE RESTORED -->
<img src="file_00000000957871f5933ba799b9ea7eb1.jpg" class="hero-img" alt="Cryptomice">

<h1 class="title">
Turn referrals into <span class="highlight">crypto rewards</span>
</h1>

<p class="desc">
Cryptomice is a digital referral rewards platform built for earning crypto.
</p>

<div class="buttons">
<button class="activate" onclick="goPayment()">Activate Account</button>
<button class="login" onclick="goLogin()">Member Login</button>
<button class="login" onclick="navigateTo('guide.html')">How it works</button>
</div>

<!-- DOWNLOAD BUTTON (ADDED, SAFE) -->
<button id="installBtn">Download App</button>

</div>

<!-- STATS -->
<div class="stats">
<div><b>10M+</b><br>Users</div>
<div><b>50K+</b><br>Earned</div>
<div><b>0.01 LTC</b><br>Signup</div>
<div><b>Referral</b><br>System</div>
</div>

<!-- FOOTER -->
<div class="footer-links">
<a href="about.html">About</a> |
<a href="terms.html">Terms</a> |
<a href="privacy.html">Privacy</a> |
<a href="contact.html">Contact</a>
</div>

<div class="footer">© 2026 Cryptomice</div>

<script>

function navigateTo(url){
window.location.href = url;
}

function goPayment(){
navigateTo("payment.html");
}

function goLogin(){
navigateTo("login.html");
}

/* INSTALL SYSTEM */
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
if(!deferredPrompt){
alert("Open in Chrome to install app");
return;
}
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt = null;
});

/* HIDE IN INSTALLED MODE */
function hideInstallInApp(){
if(window.matchMedia("(display-mode: standalone)").matches){
document.getElementById("installBtn").style.display = "none";
}
}

hideInstallInApp();
window.addEventListener("load", hideInstallInApp);

</script>

</body>
</html>
