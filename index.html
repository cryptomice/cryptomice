<!DOCTYPE html>  
<html lang="en">  
<head>  
  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  

<meta name="google-site-verification" content="Gb0y1wO-vPnZaBSbM0LvemVniT-5jbJA-xfJyXmfZL0" />  

<title>Cryptomice – Earn Crypto Through Referrals</title>  

<link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#ffd84d">  

<style>  

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#03060c;
color:white;
overflow-x:hidden;
}

.hero{
display:flex;
flex-direction:column;
padding:20px;
background:radial-gradient(circle at top,#0b1f3a,#03060c);
}

.logo{
font-size:26px;
font-weight:bold;
color:#ffd84d;
text-align:center;
text-shadow:0 0 8px #ffd84d;
}

.hero-img{
width:100%;
max-width:400px;
margin:20px auto;
display:block;
border-radius:15px;
box-shadow:0 0 30px rgba(255,215,0,0.25);
}

.title{
font-size:30px;
font-weight:bold;
text-align:center;
}

.highlight{color:#ffd84d;}

.desc{
text-align:center;
font-size:14px;
opacity:0.9;
}

.buttons button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.activate{
background:linear-gradient(90deg,#ffd84d,#ffcc00);
color:black;
}

.login{
background:#0f172a;
color:white;
}

.download{
background:linear-gradient(90deg,#22c55e,#16a34a);
color:white;
font-weight:bold;
}

.after-btn-img{
width:100%;
max-width:420px;
margin:15px auto 0 auto;
display:block;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.18);
}

</style>

</head>

<body>

<div class="hero">

<div class="logo">🐭 CRYPTOMICE</div>

<img src="file_00000000957871f5933ba799b9ea7eb1.jpg" class="hero-img">

<h1 class="title">
Turn referrals into real <span class="highlight">crypto rewards</span>
</h1>

<p class="desc">
Cryptomice is a digital referral rewards platform built for online earning and engagement.
</p>

<div class="buttons">

<button class="activate" onclick="goPayment()">Activate Account</button>  
<button class="login" onclick="goLogin()">Member Login</button>  
<button class="login" onclick="navigateTo('guide.html')">How it works</button>  

<!-- DOWNLOAD BUTTON (HIDDEN IN PWA) -->
<button id="downloadBtn" class="download" onclick="openDownload()">
Download App
</button>

<img src="file_00000000718071f6afa79b2c74eeac4a.jpg" class="after-btn-img">

</div>

</div>

<script>

function navigateTo(url){
window.location.href = url;
}

function goPayment(){
navigateTo("payment.html");
}

function goLogin(){
navigateTo("login.html");
}

function openDownload(){
window.location.href = "https://cryptomice.github.io/cryptomice/download.html";
}

/* ✅ PWA DETECTION (HIDE DOWNLOAD BUTTON IN APP MODE) */
function isPWA(){
return window.matchMedia('(display-mode: standalone)').matches ||
window.navigator.standalone === true;
}

window.addEventListener("load", () => {
if(isPWA()){
document.getElementById("downloadBtn").style.display = "none";
}
});

</script>

</body>
</html>
