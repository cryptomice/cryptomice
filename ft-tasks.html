<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks | Cryptomice Free Tasks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050812;
color:white;
padding:20px;
}

.header{
background:#111827;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#ffd84d;
font-size:22px;
font-weight:bold;
}

a{
color:#ffd84d;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:20px auto;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid rgba(255,216,77,.15);
}

.card h3{
color:#ffd84d;
margin-bottom:10px;
}

.reward{
font-size:20px;
font-weight:bold;
margin:12px 0;
}

.task-link{
background:#22c55e;
color:#050812;
}

input[type=file]{
width:100%;
padding:12px;
background:#1f2937;
color:white;
border:none;
border-radius:8px;
margin-top:15px;
}

button{
margin-top:15px;
background:#ffd84d;
color:#111827;
border:none;
padding:12px 20px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
width:100%;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.status{
margin-top:15px;
color:#9ca3af;
font-size:15px;
}

.message{
text-align:center;
background:#111827;
padding:15px;
border-radius:10px;
margin-top:20px;
color:#ffd84d;
}

.timer{
font-size:18px;
font-weight:bold;
color:#ffd84d;
margin-top:10px;
text-align:center;
}

.task-number{
color:#9ca3af;
font-size:14px;
margin-bottom:8px;
}

</style>

</head>


<body>


<div class="header">

<div class="logo">
🐭 Cryptomice Tasks
</div>

<a href="ft-dashboard.html">
Dashboard
</a>

</div>


<div class="container">


<h2>
Available Tasks
</h2>


<br>


<div id="dailyMessage"></div>


<div id="tasksContainer">

<div class="message">
Loading tasks...
</div>

</div>


</div>


<script type="module">


/*
==================================================
FIREBASE
==================================================
*/


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged,
setPersistence,
browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";



const firebaseConfig={

apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",

authDomain:"cryptomice-635eb.firebaseapp.com",

projectId:"cryptomice-635eb",

storageBucket:"cryptomice-635eb.firebasestorage.app",

messagingSenderId:"831908710470",

appId:"1:831908710470:web:e95e1bdacb90309a046247"

};



const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


await setPersistence(

auth,

browserLocalPersistence

);



/*
==================================================
GLOBAL VARIABLES
==================================================
*/


let currentUser=null;

let serviceData=null;

let availableLinks=[];

let currentLinkIndex=0;

let lastLinkTime=null;

let countdownInterval=null;


/*
==================================================
SETTINGS
==================================================
*/


let settings={

breakMinutes:15

};



/*
==================================================
LOAD SERVICE JSON
==================================================
*/


async function loadServiceLinks(){

try{

const response=await fetch(

"ft-service.json",

{

cache:"no-store"

}

);


if(!response.ok){

throw new Error(

"Unable to load ft-service.json"

);

}


serviceData=await response.json();


availableLinks=

serviceData.links || [];


/*
Only the 15-minute break is used.
*/


settings.breakMinutes=

Number(

serviceData.breakMinutes

) || 15;


/*
Force the system to one link at a time.
*/


if(availableLinks.length===0){

document.getElementById(

"tasksContainer"

).innerHTML=`

<div class="message">

No tasks are currently available.

</div>

`;

return;

}


/*
Load the user's saved position.
*/


await loadUserTaskState();


}catch(error){

console.error(

"LOAD SERVICE ERROR:",

error

);


document.getElementById(

"tasksContainer"

).innerHTML=`

<div class="message">

Unable to load tasks. Please try again later.

</div>

`;

}

}



/*
==================================================
LOGIN CHECK
==================================================
*/


onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.href=

"ft-login.html";

return;

}


currentUser=user;


console.log(

"Tasks user:",

user.email

);


await loadServiceLinks();

}

);



/*
==================================================
LOAD USER TASK STATE
==================================================
*/


async function loadUserTaskState(){

if(!currentUser){

return;

}


const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);


const snap=await getDoc(ref);


if(snap.exists()){

const data=snap.data();


/*
Current link position
*/


if(

typeof data.currentLinkIndex==="number"

){

currentLinkIndex=

data.currentLinkIndex;

}


/*
Last time a link was opened
*/


if(data.lastLinkTime){

lastLinkTime=

data.lastLinkTime.toDate();

}

}


/*
Protect against invalid index.
*/


if(

currentLinkIndex<0 ||

currentLinkIndex>=availableLinks.length

){

currentLinkIndex=0;

}


/*
Show current task.
*/


renderCurrentTask();

}



/*
==================================================
RENDER CURRENT TASK
==================================================
*/


function renderCurrentTask(){

const container=

document.getElementById(

"tasksContainer"

);


container.innerHTML="";


if(availableLinks.length===0){

container.innerHTML=`

<div class="message">

No tasks available.

</div>

`;

return;

}


/*
If all links have been used,
start again from the first link.
*/


if(

currentLinkIndex>=availableLinks.length

){

currentLinkIndex=0;

}


const task=

availableLinks[currentLinkIndex];


container.innerHTML=`

<div class="card">

<div class="task-number">

Task ${currentLinkIndex+1} of ${availableLinks.length}

</div>


<h3>

${escapeHtml(task.title || "Task")}

</h3>


<p>

Open the assigned link, complete the task, then submit a screenshot as proof.

</p>


<p class="reward">

Reward: $0.125

</p>


<button

class="task-link"

id="link${task.id}"

onclick="openTaskLink()">

🔗 Open Link

</button>


<input

type="file"

id="screenshot${task.id}"

accept="image/*">


<button

id="submit${task.id}"

onclick="submitTask()">

Submit Screenshot

</button>


<p

class="status"

id="status${task.id}">

Status: Available

</p>


</div>

`;


/*
Check whether the 15-minute wait
is currently active.
*/


checkBreak();

}



/*
==================================================
OPEN CURRENT LINK
==================================================
*/


window.openTaskLink=async()=>{

if(!currentUser){

alert(

"Please login again."

);

return;

}


const task=

availableLinks[currentLinkIndex];


if(!task){

alert(

"No task available."

);

return;

}


/*
If a break is still active,
do not allow another link.
*/


if(

lastLinkTime

){

const now=new Date();

const elapsed=

(now-lastLinkTime)/(1000*60);


if(

elapsed<settings.breakMinutes

){

const remaining=Math.ceil(

settings.breakMinutes-elapsed

);


showDailyMessage(

"Please wait "+

remaining+

" minute"+

(remaining===1?"":"s")+

" before opening the next link."

);


checkBreak();

return;

}

}


/*
Open the link.
*/


window.open(

task.url,

"_blank"

);


/*
Record the time immediately.
*/


lastLinkTime=new Date();


/*
Save activity.
*/


try{

await setDoc(

doc(

db,

"ft_task_activity",

currentUser.uid

),

{

currentLinkIndex:

currentLinkIndex,

lastLinkTime:

serverTimestamp(),

updatedAt:

serverTimestamp()

},

{

merge:true

}

);


}catch(error){

console.error(

"ACTIVITY SAVE ERROR:",

error

);

}


/*
Disable current link.
*/


const button=

document.getElementById(

"link"+task.id

);


if(button){

button.disabled=true;

button.innerText=

"⏳ 15 Minute Wait";

}


/*
Start countdown.
*/


checkBreak();

};



/*
==================================================
CHECK 15 MINUTE BREAK
==================================================
*/


function checkBreak(){

if(!lastLinkTime){

return;

}


if(countdownInterval){

clearInterval(

countdownInterval

);

}


const task=

availableLinks[currentLinkIndex];


if(!task){

return;

}


const linkButton=

document.getElementById(

"link"+task.id

);


const now=new Date();


const elapsed=

(now-lastLinkTime)/(1000*60);


const totalSeconds=

settings.breakMinutes*60;


const elapsedSeconds=

Math.floor(

(now-lastLinkTime)/1000

);


let remainingSeconds=

totalSeconds-

elapsedSeconds;


if(

remainingSeconds<=0

){

finishBreak();

return;

}


/*
Disable link while waiting.
*/


if(linkButton){

linkButton.disabled=true;

}


/*
Display countdown.
*/


updateCountdown(

remainingSeconds

);


countdownInterval=

setInterval(()=>{

const currentTime=new Date();


const secondsPassed=

Math.floor(

(currentTime-lastLinkTime)/1000

);


remainingSeconds=

totalSeconds-

secondsPassed;


if(

remainingSeconds<=0

){

clearInterval(

countdownInterval

);

countdownInterval=null;

finishBreak();

return;

}


updateCountdown(

remainingSeconds

);

},1000);

}



/*
==================================================
UPDATE COUNTDOWN
==================================================
*/


function updateCountdown(seconds){

const minutes=

Math.floor(seconds/60);


const secs=

seconds%60;


const formattedMinutes=

String(minutes)

.padStart(2,"0");


const formattedSeconds=

String(secs)

.padStart(2,"0");


showDailyMessage(

"⏳ Next link available in "

+formattedMinutes+

":"+

formattedSeconds

+"."

);

}



/*
==================================================
FINISH BREAK
==================================================
*/


async function finishBreak(){

lastLinkTime=null;


/*
Move to the next link.
*/


currentLinkIndex++;


/*
When the last link is reached,
start again from link 1.
*/


if(

currentLinkIndex>=availableLinks.length

){

currentLinkIndex=0;

}


/*
Save the new link position.
*/


if(currentUser){

try{

await setDoc(

doc(

db,

"ft_task_activity",

currentUser.uid

),

{

currentLinkIndex:

currentLinkIndex,

lastLinkTime:null,

updatedAt:

serverTimestamp()

},

{

merge:true

}

);

}catch(error){

console.error(

"NEXT LINK SAVE ERROR:",

error

);

}

}


/*
Render the next link.
*/


renderCurrentTask();


showDailyMessage(

"✅ Your 15-minute break is over. The next link is now available."

);

}



/*
==================================================
SUBMIT SCREENSHOT
==================================================
*/


window.submitTask=async()=>{

if(!currentUser){

alert(

"Please login again."

);

return;

}


const task=

availableLinks[currentLinkIndex];


if(!task){

return;

}


const file=

document.getElementById(

"screenshot"+task.id

);


const status=

document.getElementById(

"status"+task.id

);


if(!file){

return;

}


if(!file.files.length){

alert(

"Please select a screenshot."

);

return;

}


/*
A screenshot can only be submitted
after the link has been opened.
*/


if(!lastLinkTime){

alert(

"Please open the task link first."

);

return;

}


/*
Check that the 15-minute period
doesn't affect screenshot submission.
*/


status.innerText=

"Uploading...";


const formData=new FormData();


formData.append(

"screenshot",

file.files[0]

);


formData.append(

"uid",

currentUser.uid

);


formData.append(

"email",

currentUser.email

);


formData.append(

"taskId",

task.id

);


formData.append(

"taskName",

task.title || "Task #"+task.id

);



try{

const response=

await fetch(

"https://cryptomice-backend.onrender.com/upload-screenshot",

{

method:"POST",

body:formData

}

);


const result=

await response.json();


if(result.success){

status.innerText=

"✅ Screenshot submitted for review";


file.value="";


}else{

status.innerText=

result.error ||

"Upload failed";

}


}catch(error){

console.error(

"SCREENSHOT ERROR:",

error

);


status.innerText=

"Upload failed. Please try again.";

}

};



/*
==================================================
SHOW MESSAGE
==================================================
*/


function showDailyMessage(text){

const box=

document.getElementById(

"dailyMessage"

);


if(!box){

return;

}


box.innerHTML=

`

<div class="message">

${escapeHtml(text)}

</div>

`;

}



/*
==================================================
ESCAPE HTML
==================================================
*/


function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/*
==================================================
INITIAL MESSAGE
==================================================
*/


setTimeout(()=>{

if(currentUser){

if(!lastLinkTime){

showDailyMessage(

"Open the available link, complete the task, and submit your screenshot."

);

}

}

},1500);



</script>


</body>

   </html>
