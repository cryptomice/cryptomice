<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks | Cryptomice Free Tasks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050812;
color:white;
padding:20px;
}

.header{
background:#111827;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#ffd84d;
font-size:22px;
font-weight:bold;
}

a{
color:#ffd84d;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:20px auto;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
border:1px solid rgba(255,216,77,.15);
}

.card h3{
color:#ffd84d;
margin-bottom:10px;
}

.reward{
font-size:20px;
font-weight:bold;
margin:12px 0;
}

.task-link{
background:#22c55e;
color:#050812;
}

input[type=file]{
width:100%;
padding:12px;
background:#1f2937;
color:white;
border:none;
border-radius:8px;
margin-top:15px;
}

button{
margin-top:15px;
background:#ffd84d;
color:#111827;
border:none;
padding:12px 20px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
width:100%;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.status{
margin-top:15px;
color:#9ca3af;
font-size:15px;
}

.message{

text-align:center;
background:#111827;
padding:15px;
border-radius:10px;
margin-top:20px;
color:#ffd84d;

}

</style>

</head>


<body>


<div class="header">

<div class="logo">
🐭 Cryptomice Tasks
</div>


<a href="ft-dashboard.html">
Dashboard
</a>

</div>


<div class="container">


<h2>
Available Tasks
</h2>


<br>


<div id="dailyMessage"></div>


<div id="tasksContainer">

<div class="message">
Loading tasks...
</div>

</div>


</div>
<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";



import {

getAuth,

onAuthStateChanged,

setPersistence,

browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";



import {

getFirestore,

doc,

getDoc,

setDoc,

updateDoc,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";





const firebaseConfig={


apiKey:"AIzaSyA6CrK80BEX2WxISOLHXeySyElCGezZ5mw",


authDomain:"cryptomice-635eb.firebaseapp.com",


projectId:"cryptomice-635eb",


storageBucket:"cryptomice-635eb.firebasestorage.app",


messagingSenderId:"831908710470",


appId:"1:831908710470:web:e95e1bdacb90309a046247"


};




const app=initializeApp(firebaseConfig);



const auth=getAuth(app);



const db=getFirestore(app);




await setPersistence(

auth,

browserLocalPersistence

);





let currentUser=null;



let serviceData=null;



let availableLinks=[];



let usedLinks=[];



let batchCount=0;



let settings={

linksPerBatch:3,

breakMinutes:30,

dailyResetHours:24

};





/*

==============================

LOAD SERVICE LINKS

==============================

*/


async function loadServiceLinks(){


try{


const response=

await fetch("ft-service.json");



serviceData=

await response.json();



availableLinks=

serviceData.links || [];



settings.linksPerBatch=

serviceData.linksPerBatch || 3;



settings.breakMinutes=

serviceData.breakMinutes || 30;



settings.dailyResetHours=

serviceData.dailyResetHours || 24;



renderTasks();



}catch(error){


console.error(error);



document.getElementById(

"tasksContainer"

).innerHTML=`

<div class="message">

Unable to load tasks.

</div>

`;

}


}






/*

==============================

LOGIN CHECK

==============================

*/


onAuthStateChanged(auth,async(user)=>{


if(!user){


window.location.href="ft-login.html";


return;


}



currentUser=user;



console.log(

"Tasks user:",

user.email

);



await loadUserActivity();



});



/*

==============================

LOAD USER TASK DATA

==============================

*/


async function loadUserActivity(){


const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);



const snap=await getDoc(ref);



if(snap.exists()){


const data=snap.data();



usedLinks=data.usedLinks || [];



batchCount=data.batchCount || 0;



}



await checkReset();



await loadServiceLinks();



}
   
/*
==============================
RESET CHECK
==============================
*/


async function checkReset(){


const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);



const snap=await getDoc(ref);



if(!snap.exists()){

return;

}



const data=snap.data();



const now=new Date();



if(data.dayStarted){


const started=data.dayStarted.toDate();



const hours=

(now-started)/(1000*60*60);



if(hours >= settings.dailyResetHours){


await setDoc(

ref,

{

usedLinks:[],

batchCount:0,

dayStarted:serverTimestamp(),

lastBatchTime:null

},

{

merge:true

}

);



usedLinks=[];

batchCount=0;


}

}


}





/*
==============================
CREATE TASK CARDS
==============================
*/


function renderTasks(){


const container=

document.getElementById(

"tasksContainer"

);



container.innerHTML="";



availableLinks.forEach((task,index)=>{



container.innerHTML += `

<div class="card">


<h3>

Task #${task.id}

</h3>



<p>

Watch the assigned video and submit proof after completion.

</p>



<p class="reward">

Reward: $0.25

</p>



<button

class="task-link"

id="link${task.id}"

onclick="openTaskLink(${task.id})">

🔗 Open Link

</button>




<input

type="file"

id="screenshot${task.id}"

accept="image/*">



<button

onclick="submitTask(${task.id})">

Submit Screenshot

</button>



<p

class="status"

id="status${task.id}">

Status: Available

</p>



</div>

`;

});


checkTaskState();


}





/*
==============================
CHECK USER STATUS
==============================
*/


async function checkTaskState(){


const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);



const snap=

await getDoc(ref);



if(!snap.exists()) return;



const data=snap.data();



const now=new Date();



if(data.lastBatchTime){



const last=data.lastBatchTime.toDate();



const minutes=

(now-last)/(1000*60);



if(minutes < settings.breakMinutes){



const remaining=

Math.ceil(

settings.breakMinutes-minutes

);



showDailyMessage(

"Great job! You've completed this batch of tasks. Please come back in the next "

+remaining+

" minutes."

);



disableAllLinks();



return;

}


}



if(usedLinks.length >= availableLinks.length){



showDailyMessage(

"You've completed all available tasks for today. Come back in the next 24 hours for fresh tasks."

);



disableAllLinks();



return;


}


}





/*
==============================
OPEN RANDOM UNUSED LINK
==============================
*/


window.openTaskLink=async(taskId)=>{



if(!currentUser){

return;

}



if(usedLinks.includes(taskId)){


alert(

"This task has already been completed."

);


return;


}




if(batchCount >= settings.linksPerBatch){



await startBreak();



return;


}




const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);



usedLinks.push(taskId);



batchCount++;




await setDoc(

ref,

{

usedLinks:usedLinks,

batchCount:batchCount,

dayStarted:serverTimestamp()

},

{

merge:true

}

);





window.open(

availableLinks.find(

x=>x.id==taskId

).url,

"_blank"

);





const button=

document.getElementById(

"link"+taskId

);



button.disabled=true;



button.innerText=

"✅ Link Opened";



};
  
/*
==============================
START BATCH BREAK
==============================
*/


async function startBreak(){


const ref=doc(

db,

"ft_task_activity",

currentUser.uid

);



await setDoc(

ref,

{

lastBatchTime:serverTimestamp(),

batchCount:0

},

{

merge:true

}

);



batchCount=0;



showDailyMessage(

"Great job! You've completed this batch of tasks. Please come back in the next "

+settings.breakMinutes+

" minutes."

);



disableAllLinks();



}





/*
==============================
DISABLE LINKS
==============================
*/


function disableAllLinks(){


availableLinks.forEach(task=>{


const btn=document.getElementById(

"link"+task.id

);



if(btn){


btn.disabled=true;


}


});


}





/*
==============================
SHOW MESSAGE
==============================
*/


function showDailyMessage(text){


const box=

document.getElementById(

"dailyMessage"

);



if(box){


box.innerHTML=

`

<div class="message">

${text}

</div>

`;

}


}





/*
==============================
SUBMIT SCREENSHOT
==============================
*/


window.submitTask=async(taskId)=>{


const file=

document.getElementById(

"screenshot"+taskId

);



const status=

document.getElementById(

"status"+taskId

);



if(!currentUser){


status.innerText=

"No login session found";


return;


}



if(!file.files.length){


alert(

"Please select a screenshot."

);


return;


}



status.innerText=

"Uploading...";




const formData=new FormData();



formData.append(

"screenshot",

file.files[0]

);



formData.append(

"uid",

currentUser.uid

);



formData.append(

"email",

currentUser.email

);



formData.append(

"taskId",

taskId

);



formData.append(

"taskName",

"Task #"+taskId

);




try{



const response=

await fetch(

"https://cryptomice-backend.onrender.com/upload-screenshot",

{


method:"POST",

body:formData


}

);




const result=

await response.json();





if(result.success){



status.innerText=

"✅ Submitted for review";



file.value="";



}else{



status.innerText=

result.error || "Upload failed";


}




}catch(error){


console.error(error);



status.innerText=

"Upload failed";


}



};




/*
==============================
INITIAL MESSAGE
==============================
*/


setTimeout(()=>{


if(currentUser){


showDailyMessage(

"Complete today's available tasks and submit your screenshots."

);


}


},2000);



</script>


</body>


</html>
