<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice Faucet</title>

<style>
body{
margin:0;
background:#050812;
color:white;
font-family:Arial;
}

.header{
text-align:center;
padding:20px;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
color:#facc15;
font-size:28px;
font-weight:bold;
}

.box{
margin:20px;
padding:20px;
background:#111827;
border-radius:16px;
text-align:center;
}

.balance{
font-size:34px;
color:#facc15;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:12px;
color:#050812;
}

.btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

#msg{
margin-top:10px;
font-size:13px;
color:#9ca3af;
}

#loading{
text-align:center;
padding:40px;
color:#9ca3af;
}
</style>
</head>

<body>

<div id="loading">Loading faucet...</div>

<div id="app" style="display:none;">

<div class="header">
<div class="logo">🚰 Cryptomice Faucet</div>
</div>

<div class="box">
<div>Your Balance</div>
<div class="balance" id="balance">0</div>

<button class="btn" id="claimBtn" onclick="claimFaucet()" disabled>
CLAIM FAUCET
</button>

<div id="msg"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

const REWARD = 1.6;
const COOLDOWN = 2 * 60 * 60 * 1000;

const loading = document.getElementById("loading");
const appUI = document.getElementById("app");

onAuthStateChanged(auth, async (u) => {

if (!u) {
location.href = "auth.html";
return;
}

user = u;

try {

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (!snap.exists()) {
await setDoc(ref, {
coins: 0,
lastFaucet: 0
});
}

loading.style.display = "none";
appUI.style.display = "block";

await loadBalance();
await checkCooldown();

} catch (e) {
loading.innerText = "Error loading faucet: " + e.message;
}

});

async function loadBalance(){
const snap = await getDoc(doc(db,"users",user.uid));
document.getElementById("balance").innerText =
(snap.data()?.coins || 0) + " Mice Coins";
}

async function checkCooldown(){
const snap = await getDoc(doc(db,"users",user.uid));

const last = snap.data()?.lastFaucet || 0;
const now = Date.now();

const btn = document.getElementById("claimBtn");

btn.disabled = (now - last < COOLDOWN);
}

window.claimFaucet = async function(){

const msg = document.getElementById("msg");

try {

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

const data = snap.data();
const now = Date.now();

if(now - (data.lastFaucet || 0) < COOLDOWN){
msg.innerText = "❌ Wait for cooldown";
return;
}

const newCoins = (data.coins || 0) + REWARD;

await updateDoc(ref,{
coins: newCoins,
lastFaucet: now
});

document.getElementById("balance").innerText =
newCoins + " Mice Coins";

msg.innerText = "✅ +1.6 Mice Coins claimed!";

document.getElementById("claimBtn").disabled = true;

} catch (e) {
msg.innerText = "❌ Error: " + e.message;
}

};

</script>

</body>
</html>
