<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptomice Faucet</title>

<style>
body{
margin:0;
background:#050812;
color:white;
font-family:Arial;
}

.header{
text-align:center;
padding:20px;
background:#0b1220;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
color:#facc15;
font-size:28px;
font-weight:bold;
}

.box{
margin:20px;
padding:20px;
background:#111827;
border-radius:16px;
text-align:center;
}

.balance{
font-size:34px;
color:#facc15;
}

.small{
font-size:13px;
color:#9ca3af;
margin-top:6px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#facc15,#fde047);
font-weight:bold;
cursor:pointer;
margin-top:12px;
color:#050812;
}

.btn:disabled{
opacity:0.5;
cursor:not-allowed;
}

#msg{
margin-top:10px;
font-size:13px;
color:#9ca3af;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🚰 Cryptomice Faucet</div>
</div>

<div class="box">
<div class="small">Your Balance</div>
<div class="balance" id="balance">0</div>

<div class="small">
Claim 1.6 Mice Coins every 2 hours
</div>

<button class="btn" id="claimBtn" onclick="claimFaucet()">
CLAIM FAUCET
</button>

<div id="msg"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAKcPG7Iq1YkHNAGIZuvVH56AzhPgTMriY",
authDomain: "cryptomice-free-section.firebaseapp.com",
projectId: "cryptomice-free-section",
storageBucket: "cryptomice-free-section.firebasestorage.app",
messagingSenderId: "185364902129",
appId: "1:185364902129:web:51953cbb27278fb05ef950"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;
const FAUCET_REWARD = 1.6;
const COOLDOWN = 2 * 60 * 60 * 1000;

onAuthStateChanged(auth, async (u)=>{

if(!u){
location.href="auth.html";
return;
}

user = u;

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
coins:0,
lastFaucet:0
});
}

loadBalance();
checkCooldown();

});

async function loadBalance(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

document.getElementById("balance").innerText =
(Number(snap.data()?.coins||0)) + " Mice Coins";
}

window.claimFaucet = async function(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

const data = snap.data();
const now = Date.now();

if(now - (data.lastFaucet || 0) < COOLDOWN){
document.getElementById("msg").innerText =
"❌ Wait for cooldown to finish";
return;
}

let newCoins = (data.coins || 0) + FAUCET_REWARD;

await updateDoc(ref,{
coins: newCoins,
lastFaucet: now
});

document.getElementById("balance").innerText =
newCoins + " Mice Coins";

document.getElementById("msg").innerText =
"✅ +1.6 Mice Coins claimed!";
};

async function checkCooldown(){
const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

const data = snap.data();
const now = Date.now();

if(now - (data.lastFaucet || 0) < COOLDOWN){
document.getElementById("claimBtn").disabled = true;
} else {
document.getElementById("claimBtn").disabled = false;
}
}

setInterval(checkCooldown, 30000);

</script>

</body>
</html>
